<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4FC3DE">
<title>Coordinació · 2n de primària</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#4FC3DE;      /* lletra clara */
  --cyan-soft:#7FD6E9;
  --teal:#14657F;      /* lletra fosca */
  --teal-ink:#0C4658;  /* text principal */
  --sun:#F4CE5E;       /* esclat groc */
  --sun-deep:#E9B93A;
  --paper:#F5FBFD;
  --panel:#FFFFFF;
  --panel-2:#EAF6FA;
  --line:#D5EAF1;
  --muted:#5E8494;

  --mireia:#EE9B4C;
  --cristina:#D5638E;
  --pol:#5A6FE0;

  --pendent:#E9B93A;
  --proces:#4F9BDE;
  --acabada:#4CB782;

  --r:18px; --r-lg:26px;
  --shadow:0 10px 30px -12px rgba(12,70,88,.28);
  --shadow-sm:0 4px 14px -8px rgba(12,70,88,.30);
  --font-d:"Fredoka",system-ui,sans-serif;
  --font:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--teal-ink);
  background:
    radial-gradient(1200px 620px at 80% -8%, #E6F7FB 0%, rgba(230,247,251,0) 60%),
    radial-gradient(1000px 560px at -10% 110%, #E9F6EF 0%, rgba(233,246,239,0) 55%),
    var(--paper);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* ===== Identitat d'equip: aurora dels 3 tutors + fil tricolor ===== */
/* Ajusta les 3 opacitats (.42/.34/.40) per pujar o baixar el color del fons */
body::before{
  content:""; position:fixed; inset:-10%; z-index:-1; pointer-events:none;
  background:
    radial-gradient(46% 46% at 16% 84%, rgba(90,111,224,.42) 0%, transparent 70%),   /* indigo · Pol */
    radial-gradient(50% 50% at 62% 44%, rgba(213,99,142,.34) 0%, transparent 68%),    /* rosa · Cristina */
    radial-gradient(46% 46% at 86% 16%, rgba(238,155,76,.40) 0%, transparent 70%);    /* ambre · Mireia */
  animation: teamDrift 22s ease-in-out infinite alternate;
}
@keyframes teamDrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-2.2%,1.6%) scale(1.05)}
  100%{transform:translate(1.8%,-1.4%) scale(1.02)}
}
@media (prefers-reduced-motion:reduce){ body::before{animation:none} }
button{font-family:inherit;cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--pol);outline-offset:2px;border-radius:8px}
::selection{background:var(--sun);color:var(--teal-ink)}

/* ---------- reusable ---------- */
.eyebrow{font-family:var(--font);font-weight:800;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.4em;font-weight:800;font-size:.74rem;padding:.28em .7em;border-radius:999px;line-height:1;white-space:nowrap}
.avatar{display:grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--font-d);font-weight:600;flex:none;box-shadow:inset 0 -2px 6px rgba(0,0,0,.12)}
.btn{border:none;border-radius:14px;font-weight:800;padding:.7em 1.1em;display:inline-flex;align-items:center;gap:.5em;transition:transform .12s ease, box-shadow .2s ease, background .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-primary{background:linear-gradient(180deg,var(--cyan),#38B4D2);color:#063341;box-shadow:0 8px 18px -8px rgba(20,101,127,.65)}
.btn-primary:hover{box-shadow:0 12px 22px -8px rgba(20,101,127,.7)}
.btn-ghost{background:var(--panel-2);color:var(--teal)}
.btn-ghost:hover{background:#dff1f6}
.icon{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* burst dashes motif */
.burst span,.t-burst span{position:absolute;width:3px;border-radius:3px;background:var(--sun);transform-origin:center;opacity:.9}

/* ======================================================= LOGIN */
#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:26px;
  background:radial-gradient(900px 600px at 50% -10%,#EAF8FC,transparent 65%),var(--paper);
  transition:opacity .5s ease, visibility .5s}
#login.gone{opacity:0;visibility:hidden;pointer-events:none}
.login-card{width:min(520px,100%);text-align:center}
.login-card .mark{width:min(380px,86%);margin:0 auto 10px;display:block;filter:drop-shadow(0 16px 22px rgba(12,70,88,.18));animation:pop .7s cubic-bezier(.2,1.3,.4,1) both}
.login-card .login-bars{width:120px;height:84px;display:block;margin:0 auto 18px;animation:pop .7s cubic-bezier(.2,1.3,.4,1) both}
.login-card .login-title{font-family:var(--font-d);font-weight:600;color:var(--teal-ink);font-size:2.5rem;line-height:1;margin:0 0 14px;letter-spacing:-.01em}
.login-card .login-line{width:132px;height:5px;border-radius:5px;margin:0 auto 22px;background:linear-gradient(90deg,#5A6FE0,#D5638E,#EE9B4C)}
.login-card p{color:var(--muted);font-weight:800;font-size:1.05rem;margin:0 0 22px}
.who{display:grid;gap:12px}
.who-btn{display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);
  border-radius:var(--r-lg);padding:12px 16px;text-align:left;transition:transform .14s, border-color .2s, box-shadow .2s;box-shadow:var(--shadow-sm)}
.who-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.who-btn .avatar{width:52px;height:52px;font-size:1.2rem}
.who-btn b{font-family:var(--font-d);font-weight:600;font-size:1.15rem;display:block;color:var(--teal-ink)}
.who-btn small{color:var(--muted);font-weight:700}
.who-btn .go{margin-left:auto;color:var(--muted)}

/* ======================================================= APP SHELL */
#app{max-width:1120px;margin:0 auto;padding:22px 20px 140px}
#app.blur{filter:blur(3px);pointer-events:none;user-select:none}

/* topbar (home pill only — no menu) */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.home-pill{display:flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 8px;box-shadow:var(--shadow-sm);font-weight:800;color:var(--teal)}
.home-pill img{width:30px;height:30px;object-fit:contain}
.home-pill .pill-sheets{width:30px;height:30px;display:block;flex:none}
.home-pill .icon{width:16px;height:16px;stroke-width:3}
.search-pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:999px;padding:8px 15px;box-shadow:var(--shadow-sm);font-weight:800;color:var(--teal)}
.search-pill .icon{width:18px;height:18px;stroke-width:2.7}
.search-pill:hover{border-color:var(--cyan)}
@media(max-width:520px){.search-pill .lbl{display:none}.search-pill{padding:8px 11px}}
.topbar .me{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--shadow-sm);font-weight:800;color:var(--teal-ink);cursor:pointer;transition:.15s}
.topbar .me:hover{border-color:var(--indigo)}
.topbar .me .avatar{width:32px;height:32px;font-size:.85rem}
.topbar .me .me-gear{width:17px;height:17px;stroke:var(--muted);stroke-width:2;flex:none}
.topbar .me:hover .me-gear{stroke:var(--indigo)}
/* popup de perfil */
.pm-box{text-align:left}
.pm-box h3{text-align:center}
.pm-who{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.pm-user{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;font:inherit;transition:.15s}
.pm-user:hover{border-color:var(--c);transform:translateY(-1px)}
.pm-user.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.pm-user .avatar{width:38px;height:38px;color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.pm-user b{font-family:var(--font-d);font-weight:600;color:var(--teal-ink);font-size:1.05rem;flex:1}
.pm-cur{font-weight:800;font-size:.72rem;color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff);padding:2px 9px;border-radius:999px}
.pm-notif{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--line)}
.pm-nrow{display:flex;align-items:center;gap:12px}
.pm-ntxt{flex:1}
.pm-ntxt b{display:block;color:var(--teal-ink);font-family:var(--font-d);font-weight:600}
.pm-ntxt small{color:var(--muted);font-weight:700;font-size:.82rem}
.pm-switch{flex:none;width:46px;height:27px;border-radius:999px;border:0;background:#cfdae0;position:relative;cursor:pointer;transition:.18s}
.pm-switch.on{background:var(--indigo)}
.pm-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.18s}
.pm-switch.on .pm-knob{transform:translateX(19px)}
.pm-hint{color:var(--muted);font-weight:600;font-size:.8rem;line-height:1.45;margin-top:10px}
.pm-test{margin-top:12px;width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--teal-ink);font-weight:800;font-size:.88rem;padding:.6em;border-radius:11px;cursor:pointer}
.pm-test:hover{border-color:var(--indigo);color:var(--indigo)}

/* ---------- HERO ---------- */
.hero{position:relative;text-align:center;padding:14px 0 6px;margin-bottom:4px}
.hero .rays{position:absolute;inset:0;pointer-events:none}
.hero-logo{width:min(430px,82%);margin:0 auto;display:block;position:relative;z-index:2;
  filter:drop-shadow(0 20px 26px rgba(12,70,88,.14));animation:pop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.greet{position:relative;z-index:2;font-family:var(--font-d);font-weight:500;color:var(--teal);margin:2px 0 0;font-size:1.05rem}
.greet b{font-weight:600}

/* ---------- capçal: botó d'acció + pícnics ---------- */
.sec-action{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.95);border:none;color:var(--teal-ink);font-weight:800;font-size:.85rem;padding:.55em .9em;border-radius:12px;box-shadow:var(--shadow-sm);cursor:pointer;flex:none}
.sec-action:hover{background:#fff;transform:translateY(-1px)}
.sec-action .icon{width:16px;height:16px;stroke-width:2.4}
.pic-cls{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 8px}
.pic-chip{border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-weight:800;font-size:.92rem;padding:.7em .5em;border-radius:13px;transition:.12s;text-align:center}
.pic-chip:hover{border-color:var(--cyan)}
.pic-chip.on{border-color:transparent;background:linear-gradient(180deg,var(--acabada),#3ba06f);color:#fff}

/* ---------- EINES · assistència ---------- */
.att-status{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.att-stat{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.82rem;color:var(--teal-ink);box-shadow:var(--shadow-sm)}
.att-stat.done{border-color:var(--acabada)}
.att-stat .att-ok{color:var(--acabada);font-weight:800}
.att-stat .att-pend{color:var(--muted);font-weight:800}
.att-stat .att-n{font-weight:800;color:var(--cristina)}
.att-refresh{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);color:var(--teal);box-shadow:var(--shadow-sm);display:grid;place-items:center}
.att-refresh:hover{border-color:var(--cyan)}
.att-classsel{display:inline-flex;background:var(--panel-2);border-radius:12px;padding:4px;gap:3px;margin-bottom:14px}
.att-tab{border:1.5px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:.9rem;padding:.5em 1em;border-radius:9px}
.att-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.att-count{font-weight:700;color:var(--teal-ink)}
.att-count .att-cabs{color:var(--cristina)}
.att-hint{color:var(--muted);font-weight:700;font-size:.82rem}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-bottom:18px}
.att-chip{border:1.5px solid #bfe6cf;background:#eafaf1;color:#1c7a4d;font-weight:800;font-size:.92rem;padding:.7em .5em;border-radius:13px;transition:.12s;text-align:center}
.att-chip:hover{filter:brightness(.98)}
.att-chip.absent{border-color:#f2bccd;background:#fdeaf0;color:var(--cristina);text-decoration:line-through}
.att-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.att-result{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm)}
.att-warn{background:#fff7e6;border:1.5px solid #f0d79a;color:#8a6a1e;font-weight:700;font-size:.85rem;border-radius:12px;padding:9px 12px;margin-bottom:12px}
.att-result pre{white-space:pre-wrap;font-family:var(--font);font-weight:600;color:var(--teal-ink);background:var(--paper);border-radius:12px;padding:14px;margin:0;line-height:1.5;font-size:.92rem}
.att-result-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---------- EINES · generador de grups ---------- */
.grp-controls{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-sm);margin-bottom:18px;display:grid;gap:16px}
.grp-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.grp-size{width:100px}
.grp-toggle{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;color:var(--teal);box-shadow:var(--shadow-sm);transition:.15s}
.grp-toggle:hover{border-color:var(--cyan)}
.grp-toggle.on{background:linear-gradient(180deg,var(--cyan),#38B4D2);color:#063341;border-color:transparent}
.grp-toggle .icon{width:16px;height:16px;stroke-width:2.4}
.grp-cons-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp-cons-add select{min-width:130px;flex:1}
.grp-cons-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.grp-cons{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border-radius:999px;padding:.35em .5em .35em .8em;font-weight:800;font-size:.82rem;color:var(--teal-ink)}
.grp-cons .gx{background:transparent;border:none;color:var(--muted);font-weight:900;font-size:1.05rem;line-height:1;padding:0 .1em;cursor:pointer}
.grp-cons .gx:hover{color:var(--cristina)}
.grp-generate{justify-content:center}
.grp-results{display:grid;gap:18px}
.grp-section-title{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:600;font-size:1.2rem;color:var(--teal-ink);margin:0 2px 8px}
.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}
.grp-card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm)}
.grp-card h4{font-family:var(--font-d);font-weight:600;margin:0 0 8px;color:var(--teal-ink);display:flex;align-items:center;gap:8px;font-size:1.05rem}
.grp-card .gcount{margin-left:auto;background:var(--panel-2);color:var(--muted);font-weight:800;font-size:.72rem;padding:.1em .55em;border-radius:999px}
.grp-member{display:flex;align-items:center;gap:8px;padding:4px 0;font-weight:700;color:var(--teal-ink);font-size:.92rem}
.gm-name{flex:1;min-width:0}
.grp-cls{font-weight:800;font-size:.66rem;padding:.12em .45em;border-radius:999px;flex:none}
.grp-mark{color:var(--sun-deep);font-size:.9rem;flex:none}
.grp-dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ---- comandes ---- */
.comanda-list{display:grid;gap:10px}
.comanda-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;padding:10px 2px}
.comanda-btn{display:flex;flex-direction:column;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:13px 16px;box-shadow:var(--shadow-sm);color:var(--teal-ink);transition:border-color .2s}
.comanda-btn:hover{border-color:var(--cyan)}
.cb-main{display:flex;align-items:center;gap:13px}
.comanda-btn .cb-ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--panel-2);color:#C77D4A}
.comanda-btn .cb-ico .icon{width:22px;height:22px}
.comanda-btn .cb-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.comanda-btn .cb-txt b{font-family:var(--font-d);font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comanda-btn .cb-txt small{color:var(--muted);font-weight:700;font-size:.8rem}
.cb-acts{display:flex;gap:8px;margin-left:auto;flex:none}
.cb-act{display:inline-flex;align-items:center;gap:6px;border-radius:12px;font-weight:800;font-size:.86rem;padding:.55em .95em;cursor:pointer;text-decoration:none;transition:.15s;border:1.5px solid transparent}
.cb-act .icon{width:16px;height:16px}
.cb-open{background:linear-gradient(180deg,var(--cyan),#38B4D2);color:#063341}
.cb-open:hover{box-shadow:0 8px 16px -8px rgba(20,101,127,.6)}
.cb-edit{background:var(--panel-2);color:var(--teal);border-color:var(--line)}
.cb-edit:hover{border-color:var(--cyan);background:#dff1f6}
.cb-edit:disabled{opacity:.7}
.cb-dim{opacity:.45;pointer-events:none}
.cb-flow{display:grid;gap:9px;margin-top:11px;padding-top:11px;border-top:1.5px dashed var(--line)}
.cb-flow-row{display:flex;align-items:center;gap:9px}
.cb-flow-lbl{font-weight:800;font-size:.82rem;color:var(--teal-ink);width:118px;flex:none}
.cb-send-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--teal);border-radius:12px;font-weight:800;font-size:.84rem;padding:.5em .9em;text-decoration:none;transition:.15s;flex:none}
.cb-send-btn:hover{border-color:var(--sun-deep);background:#fffbf0;color:var(--teal-ink)}
.cb-send-btn .icon{width:16px;height:16px;color:var(--sun-deep)}
.cb-check{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;font-weight:800;font-size:.84rem;padding:.5em .9em;cursor:pointer;transition:.15s;margin-left:auto;flex:none}
.cb-check .cbx{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.cb-check .cbx .icon{width:13px;height:13px;color:#fff;opacity:0;transition:.15s}
.cb-check:hover{border-color:var(--acabada)}
.cb-check.on{border-color:transparent;background:linear-gradient(180deg,var(--acabada),#3ba06f);color:#fff}
.cb-check.on .cbx{background:rgba(255,255,255,.28);border-color:transparent}
.cb-check.on .cbx .icon{opacity:1}
/* ---------- Programació ---------- */
.prog-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.prog-tab{border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--font-d);font-weight:600;font-size:.95rem;padding:.5em 1.1em;border-radius:999px;cursor:pointer;transition:.15s}
.prog-tab:hover{border-color:var(--c)}
.prog-tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 8px 16px -10px var(--c)}
.prog-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.prog-week{background:var(--panel);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow-sm)}

.prog-ta{width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;font-size:.96rem;line-height:1.55;resize:vertical;color:var(--ink);background:var(--paper);transition:border-color .15s}
.prog-week .input{background:var(--paper)}

.prog-open{display:inline-block;margin-top:8px;color:var(--c);font-weight:800;font-size:.88rem;text-decoration:none}

.prog-track{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;padding-top:14px;border-top:1.5px dashed var(--line)}

.prog-tutor{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font-weight:800;font-size:.86rem;padding:.45em .9em;border-radius:999px;cursor:pointer;transition:.15s}

.prog-tutor .tick{opacity:0;width:0;overflow:hidden;transition:.15s}
.prog-tutor.on{background:var(--c);border-color:var(--c);color:#fff}
.prog-tutor.on .dot{background:#fff}
.prog-tutor.on .tick{opacity:1;width:auto}
.prog-seg{display:inline-flex;background:#eef3f6;border-radius:999px;padding:3px;margin-bottom:14px}
.prog-segbtn{border:0;background:transparent;font:inherit;font-weight:800;font-size:.86rem;color:var(--muted);padding:7px 15px;border-radius:999px;cursor:pointer;transition:.15s}
.prog-segbtn.on{background:#fff;color:var(--teal-ink);box-shadow:0 2px 8px -3px rgba(9,50,64,.35)}
.prog-jump{border:0;background:color-mix(in srgb,var(--cyan) 20%,#fff);color:var(--teal-ink);font-weight:800;font-size:.85rem;padding:.55em 1em;border-radius:10px;cursor:pointer;margin-bottom:12px}
.prog-jump:hover{filter:brightness(.97)}
.prog-week-cap{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.prog-week-cap b{font-family:var(--font-d);font-weight:600;font-size:1.2rem;color:var(--c)}
.prog-week-cap span{color:var(--muted);font-weight:700;font-size:.9rem}
.prog-week.now{box-shadow:0 0 0 2px var(--c), var(--shadow-sm)}
.prog-list{display:flex;flex-direction:column;gap:8px}
.prog-progress{margin:-2px 0 14px}
.pp-bar{height:7px;border-radius:99px;background:#e7eef2;overflow:hidden}
.pp-bar span{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .35s ease}
.pp-txt{margin-top:5px;font-weight:800;font-size:.8rem;color:var(--muted)}
.pp-txt b{color:var(--c)}
.prog-row.empty{opacity:.5}
.prog-row.empty:hover,.prog-row.empty:focus-within{opacity:1}
.prog-row.vac{background:repeating-linear-gradient(45deg,#f3f6f8,#f3f6f8 8px,#eef2f5 8px,#eef2f5 16px);border-left-color:#b8c4cc;opacity:.9}
.prog-row.vac .prog-row-wk b{color:#7a8a93}
.prog-row-txt.vacx{color:#8a99a1;font-weight:800}
.prog-vac{text-align:center;background:repeating-linear-gradient(45deg,#f3f6f8,#f3f6f8 10px,#eef2f5 10px,#eef2f5 20px);border:1.5px dashed #c3d0d7;border-radius:var(--r-lg);padding:30px 22px}
.prog-vac .pv-ico{font-size:2.2rem}

.prog-vac span{color:var(--muted);font-weight:700}
.prog-vac p{color:var(--muted);font-weight:700;margin:10px 0 0}
.prog-fest{display:flex;flex-wrap:wrap;gap:7px;margin:-6px 0 14px}
.pf-tag{display:inline-flex;align-items:center;gap:5px;background:#fdecec;color:#c0392b;font-weight:800;font-size:.8rem;padding:.35em .7em;border-radius:999px}
.pf-mini{color:#e5484d;font-weight:800}
.prog-act{display:flex;flex-wrap:wrap;gap:7px;margin:-6px 0 14px}
.pa-tag{display:inline-flex;align-items:center;gap:5px;background:#e8f4fb;color:#1c6fa0;font-weight:800;font-size:.8rem;padding:.35em .7em;border-radius:999px}
.pa-mini{color:#2D9CDB;font-weight:800}
/* --- Programació anual: etiquetes de tipus, sessions i pendents --- */
.prog-red{display:flex;flex-wrap:wrap;gap:7px;margin:-6px 0 14px}
.pr-tag{display:inline-flex;align-items:center;gap:5px;background:#fff4e0;color:#a4680d;font-weight:800;font-size:.8rem;padding:.35em .7em;border-radius:999px}

.ptl-tag{display:inline-flex;align-items:center;gap:5px;background:#eef0f5;color:#55607a;font-weight:800;font-size:.8rem;padding:.35em .7em;border-radius:999px}
/* --- El racó dels reptes --- */
.rept-note{background:#fff7e6;border:1.5px solid #f0dfb0;color:#8a6d1f;font-weight:600;font-size:.86rem;padding:.7em .9em;border-radius:12px;margin-bottom:12px}
.rept-mat{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 32%,#fff);font-weight:800;font-size:.78rem;padding:.25em .6em;border-radius:8px}

  padding:12px 14px;margin:16px 0 8px;display:grid;gap:8px}

.rept-stars{color:#F2994A;letter-spacing:1px}

.rept-nivrow{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}

.rept-card{background:var(--panel);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r-lg);padding:14px;display:grid;gap:9px;box-shadow:var(--shadow-sm)}

.rept-num{background:var(--panel-2);color:var(--teal);border-radius:6px;padding:.1em .4em;font-weight:800;font-size:.72rem}

.rept-lowtag{color:#a4680d;font-weight:800}

.rept-form{background:var(--panel-2);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:14px;display:grid;gap:10px;margin-bottom:14px}

.rept-recent-h{font-family:var(--font-d);font-weight:600;color:var(--teal-ink);margin:16px 0 8px}

.rept-reg-nom{font-weight:800;color:var(--teal-ink);flex:1;min-width:0}

.rept-reg.curs .rept-reg-toggle{border-color:#f0e2b0;color:#a4680d}
.rept-reg-val{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);font-weight:800;font-size:.72rem;padding:.2em .5em;border-radius:7px}
.rept-reg-by{font-size:.74rem;color:var(--muted);font-weight:700}

.rept-alu-sub{color:var(--muted);font-weight:700;font-size:.85rem}
.rept-grp{margin-bottom:8px}

.pit-k{flex:none;background:color-mix(in srgb, var(--c) 14%, #fff);color:var(--c);border:1px solid color-mix(in srgb, var(--c) 32%, #fff);

.pf-acts{margin-top:6px;color:#1c6fa0;font-weight:700}

.pt-count{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);font-weight:800;padding:0 6px;border-radius:99px}

}

  font-weight:800;font-size:.78rem;padding:.4em .7em;border-radius:9px;cursor:pointer}
.cbtn .icon{width:14px;height:14px}
.cbtn:hover{background:var(--panel-2);color:var(--teal)}
.cbtn.primary{border-color:#27AE60;color:#1f8a4c}
.cbtn.primary:hover{color:#fff;background:#27AE60;border-color:#27AE60}
.cthread-info{color:var(--muted);font-weight:700;font-size:.76rem}
.ccomposer{display:flex;gap:6px;align-items:flex-end}
.creply-composer{margin-left:16px}
.cinput{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:.5em .7em;
  font-family:var(--font);font-weight:600;font-size:.9rem;color:#33555f;line-height:1.4;max-height:140px}
.cinput:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,195,222,.2)}
.cpost{flex:0 0 auto;border:none;background:var(--teal);color:#fff;font-weight:800;font-size:.82rem;padding:.55em .9em;border-radius:10px;cursor:pointer}
.cpost:hover{background:var(--teal-ink)}
.cp-resolved{display:grid;gap:8px}
.cp-restoggle{display:inline-flex;align-items:center;gap:.4em;justify-self:start;border:none;background:transparent;color:var(--muted);font-weight:800;font-size:.8rem;cursor:pointer;padding:.2em 0}
.cp-restoggle .icon{width:14px;height:14px;color:#27AE60}
.cp-resbox{display:grid;gap:8px}
.edit-btn{background:transparent;border:none;color:#c3d6dd;padding:4px;border-radius:8px}
.edit-btn:hover{color:var(--teal);background:var(--panel-2)}
.entry.editing,.task.editing{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,195,222,.25),var(--shadow-sm)}
.entry.editing .field,.task.editing .field{margin-bottom:10px}
.edit-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.editing .btn{padding:.55em .95em;font-size:.85rem}
.edited-tag{color:var(--sun-deep);font-weight:800;font-size:.74rem}
.task .move{margin-top:10px}
.task-tools{display:flex;gap:2px;margin-left:auto}

/* ---------- KANBAN ---------- */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:var(--panel-2);border-radius:var(--r-lg);padding:12px;min-height:120px}
.col.drop{outline:2.5px dashed var(--cyan);outline-offset:-4px}
.col-head{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:600;font-size:1rem;margin:2px 4px 10px;color:var(--teal-ink)}
.col-head .dot{width:11px;height:11px;border-radius:50%}
.col-head .n{margin-left:auto;background:#fff;color:var(--muted);font-weight:800;font-size:.78rem;padding:.1em .55em;border-radius:999px}
.task{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:grab}
.task:active{cursor:grabbing}
.task.dragging{opacity:.5}
.task h5{margin:0 0 5px;font-family:var(--font-d);font-weight:600;font-size:1rem;color:var(--teal-ink)}
.task .desc{font-weight:600;color:#4a6d77;font-size:.88rem;line-height:1.4;margin:0 0 9px;white-space:pre-wrap}
.task .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.task .link{display:inline-flex;align-items:center;gap:.3em;background:var(--panel-2);color:var(--teal);font-weight:800;font-size:.76rem;padding:.35em .6em;border-radius:9px;text-decoration:none}
.task .move{display:flex;gap:5px;margin-top:10px}
.task .move button{flex:1;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-weight:800;
  font-size:.72rem;padding:.4em;border-radius:9px}
.task .move button.on{color:#fff;border-color:transparent}
.task .del{background:transparent;border:none;color:#c3d6dd;padding:3px;border-radius:7px;margin-left:auto}
.task .del:hover{color:var(--cristina)}
.task .toprow{display:flex;align-items:flex-start;gap:8px}
.task .toprow h5{flex:1}
.col-empty{color:var(--muted);font-weight:700;font-size:.85rem;text-align:center;padding:16px 8px;opacity:.7}
.kan-controls{display:flex;justify-content:flex-end;margin-bottom:12px}
.kan-toggle{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:12px;padding:8px 14px;font-weight:800;color:var(--teal);box-shadow:var(--shadow-sm);transition:.15s}
.kan-toggle .icon{width:16px;height:16px;stroke-width:2.2}
.kan-toggle:hover{border-color:var(--cyan)}
.kan-toggle.on{background:linear-gradient(180deg,var(--cyan),#38B4D2);color:#063341;border-color:transparent}
.kan-group-head{display:flex;align-items:center;gap:7px;margin:10px 3px 7px;font-weight:800;font-size:.78rem;color:var(--teal-ink)}
.kan-group-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
.kan-group-head .n{margin-left:auto;color:var(--muted);font-size:.72rem;background:#fff;padding:.05em .5em;border-radius:999px}

/* ---------- editor de text enriquit + taules ---------- */
.rich{border:1.5px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.rich-tb{display:flex;flex-wrap:wrap;gap:5px;padding:7px;background:var(--panel-2);border-bottom:1.5px solid var(--line)}
.rich-btn{border:none;background:#fff;border-radius:9px;padding:.4em .7em;font-weight:800;font-size:.82rem;color:var(--teal);box-shadow:var(--shadow-sm)}
.rich-btn:hover{background:#eaf6fa}
.rich-btn.on{background:var(--cyan);color:#063341;box-shadow:inset 0 0 0 2px rgba(6,51,65,.15)}
.rich-sep{width:1px;background:var(--line);margin:3px 2px}
.rich-ed{min-height:120px;padding:12px;font-weight:500;color:var(--teal-ink);line-height:1.5;outline:none;background:#fff}
.rich-ed:empty:before{content:'Escriu aquí… (pots inserir taules)';color:#9db8c2}
.rich-ed b,.rich-ed strong,.rich-body b,.rich-body strong{font-weight:800}
.rich-ed i,.rich-ed em,.rich-body i,.rich-body em{font-style:italic;font-weight:inherit}
.rich-ed table,.rich-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.9rem}
.rich-ed th,.rich-ed td,.rich-body th,.rich-body td{border:1.5px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.rich-ed th,.rich-body th{background:var(--panel-2);font-weight:800;color:var(--teal-ink)}
.rich-ed ul,.rich-body ul,.rich-ed ol,.rich-body ol{margin:6px 0;padding-left:22px}
.rich-body{white-space:normal!important;font-weight:500}
.rich-body p{margin:6px 0}
.rich-body table{max-width:100%;display:block;overflow-x:auto}

/* ---------- floating launcher ---------- */
.launcher{position:fixed;right:20px;bottom:22px;z-index:40}
.launch-btn{width:60px;height:60px;border-radius:20px;border:none;background:linear-gradient(180deg,var(--teal),#0c4e63);
  color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -8px rgba(12,70,88,.6);transition:transform .16s}
.launch-btn:hover{transform:translateY(-3px) rotate(-4deg)}
.launch-btn .icon{width:26px;height:26px;stroke-width:2.6}
.sheet{position:fixed;inset:0;z-index:45;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .scrim{position:absolute;inset:0;background:rgba(9,50,63,.42);backdrop-filter:blur(2px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .panel{position:relative;z-index:1;background:var(--paper);width:min(560px,100%);border-radius:26px 26px 0 0;
  padding:16px 16px 26px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);animation:up .28s cubic-bezier(.2,1,.3,1);
  max-height:86dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--font-d);font-weight:600;text-align:center;margin:0 0 12px;color:var(--teal)}
.sheet .qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;
  padding:11px;text-align:left;font-weight:800;color:var(--teal-ink)}
.qbtn:hover{border-color:var(--cyan)}
.qbtn .qi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.qbtn .qi .icon{width:19px;height:19px;stroke:#fff}
.qbtn .qn{font-size:.9rem;line-height:1.1}
.qbtn .qb{margin-left:auto;background:var(--sun);color:#5a4406;font-weight:800;font-size:.72rem;padding:.1em .5em;border-radius:999px}

/* toast */
/* ---------- CERCADOR ---------- */
.search-overlay{position:fixed;inset:0;z-index:55;display:none}
.search-overlay.open{display:block}
.search-overlay .scrim{position:absolute;inset:0;background:rgba(9,50,63,.42);backdrop-filter:blur(2px);animation:fade .2s}
.search-panel{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 14px}
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:13px 15px;box-shadow:var(--shadow);animation:sdown .26s cubic-bezier(.2,1,.3,1)}
@keyframes sdown{from{transform:translateY(-18px);opacity:.4}}
.search-bar .icon{width:22px;height:22px;stroke:var(--muted);flex:none}
.search-bar input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-weight:700;font-size:1.05rem;color:var(--teal-ink);background:transparent}
.search-bar input::placeholder{color:#9db8c2;font-weight:700}
.search-bar .close{background:var(--panel-2);border:none;border-radius:11px;color:var(--muted);font-weight:800;width:34px;height:34px;flex:none;font-size:1rem}
.search-bar .close:hover{background:#dceff4}
.search-results{margin-top:12px;display:grid;gap:10px;max-height:66vh;overflow:auto;padding:2px}
.sres{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;width:100%;animation:sdown .2s}
.sres:hover{border-color:var(--cyan);transform:translateY(-1px)}
.sres .avatar{width:32px;height:32px;font-size:.82rem;flex:none}
.sres-ico{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border-radius:50%;font-size:1rem}
.sres .body{flex:1;min-width:0}
.sres .top{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.sres h5{margin:0 0 3px;font-family:var(--font-d);font-weight:600;font-size:1.02rem;color:var(--teal-ink);line-height:1.2}
.sres p{margin:0;color:#4a6d77;font-weight:600;font-size:.86rem;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-empty{text-align:center;color:var(--muted);font-weight:700;padding:26px 16px;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm)}
.flash{animation:flash 1.7s ease}
@keyframes flash{0%,32%{box-shadow:0 0 0 3px var(--sun-deep),var(--shadow-sm)}100%{box-shadow:var(--shadow-sm)}}

/* ---------- MODAL confirmació ---------- */
.modal{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(9,50,63,.5);backdrop-filter:blur(2px);animation:fade .2s}
.modal-box{position:relative;z-index:1;background:#fff;width:min(400px,100%);border-radius:24px;padding:26px 24px 20px;text-align:center;box-shadow:var(--shadow);animation:up .26s cubic-bezier(.2,1,.3,1)}
.modal-ico{font-size:2rem;margin-bottom:4px}
.modal-box h3{font-family:var(--font-d);font-weight:600;font-size:1.25rem;margin:0 0 6px;color:var(--teal-ink)}
.modal-box p{color:var(--muted);font-weight:700;margin:0 0 20px;line-height:1.45}
.modal-note{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin:0 0 20px;color:var(--ink);font-weight:600;line-height:1.55;white-space:normal;max-height:50vh;overflow:auto}
.modal-actions{display:flex;gap:10px;justify-content:center}
.modal-actions .btn{flex:1;justify-content:center}
.btn-danger{background:linear-gradient(180deg,#EC6A88,#DB4F72);color:#fff;box-shadow:0 8px 18px -8px rgba(219,79,114,.6)}
.btn-danger:hover{filter:brightness(1.03)}

/* ---------- SUBTEMES ---------- */
.add-sub{display:flex;gap:10px;align-items:flex-end}
.add-sub .field{flex:1}
.subtheme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.subtheme-card{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--panel);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .16s,box-shadow .2s,border-color .2s;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.subtheme-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--cyan)}
.subtheme-card .st-name{font-family:var(--font-d);font-weight:600;font-size:1.08rem;color:var(--teal-ink);line-height:1.15;padding-right:30px}
.subtheme-card .st-meta{font-weight:800;font-size:.8rem;color:var(--muted);margin-top:6px}
.subtheme-card .st-bar{height:5px;border-radius:5px;margin-top:10px;opacity:.9}
.subtheme-card .st-badge{position:absolute;top:11px;right:36px;background:var(--sun);color:#5a4406;font-weight:800;font-size:.72rem;min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:999px;display:grid;place-items:center}
.subtheme-card .del{position:absolute;top:8px;right:8px;background:transparent;border:none;color:#c3d6dd;
  padding:5px;border-radius:9px;line-height:0;opacity:.55;transition:color .15s,background .15s,opacity .15s}
.subtheme-card .del .icon{width:15px;height:15px;stroke-width:2.2}
.subtheme-card:hover .del{opacity:.9}
.subtheme-card .del:hover{opacity:1;color:var(--cristina);background:var(--panel-2)}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border:none;color:#fff;font-weight:800;
  font-size:.82rem;padding:.42em .85em;border-radius:999px;margin-bottom:12px;position:relative;z-index:1}
.back-btn:hover{background:rgba(255,255,255,.34)}
.back-btn .icon{width:1em;height:1em;stroke-width:3}

/* ---------- COSES A FER dins d'entrades ---------- */
.todos{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:11px}
.todos-title{font-weight:800;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.todos-title .icon{width:14px;height:14px;stroke-width:2.6}
.todo{display:flex;align-items:center;gap:9px;padding:5px 0}
.todo .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;cursor:pointer;transition:.15s;padding:0}
.todo .box:hover{border-color:var(--acabada)}
.todo.done .box{background:var(--acabada);border-color:var(--acabada)}
.todo .box .icon{width:13px;height:13px;stroke:#fff;stroke-width:3.5;opacity:0}
.todo.done .box .icon{opacity:1}
.todo .txt{flex:1;font-weight:700;color:var(--teal-ink);font-size:.92rem;line-height:1.3}
.todo.done .txt{text-decoration:line-through;color:var(--muted)}
.todo .owner-sel{border:1.5px solid var(--line);border-radius:9px;padding:.28em .4em;font-family:inherit;font-weight:800;font-size:.72rem;color:var(--teal);background:var(--paper);flex:none}
.todo .rm{background:transparent;border:none;color:#c9dbe1;padding:3px;border-radius:7px;line-height:0;flex:none}
.todo .rm .icon{width:14px;height:14px}
.todo .rm:hover{color:var(--cristina);background:var(--panel-2)}
.add-todo-toggle{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:800;font-size:.82rem;border-radius:11px;padding:.5em .8em;margin-top:9px;width:100%;display:flex;align-items:center;justify-content:center;gap:.35em}
.add-todo-toggle:hover{border-color:var(--cyan);color:var(--teal)}
.todo-add{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.todo-add input{flex:1;min-width:130px;border:1.5px solid var(--line);border-radius:11px;padding:.55em .75em;font-family:inherit;font-weight:700;font-size:.9rem;background:var(--paper)}
.todo-add input:focus{border-color:var(--cyan);background:#fff;outline:none}
.todo-add select{border:1.5px solid var(--line);border-radius:11px;padding:.55em .5em;font-family:inherit;font-weight:800;font-size:.78rem;color:var(--teal);background:var(--paper)}
.todo-add .go{border:none;background:linear-gradient(180deg,var(--cyan),#38B4D2);color:#063341;font-weight:800;border-radius:11px;padding:.55em .85em;font-size:.84rem}

/* panell central de coses a fer soltes */
.loose{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.loose-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.loose-head h3{font-family:var(--font-d);font-weight:600;font-size:1.12rem;margin:0;color:var(--teal-ink)}
.loose-count{background:var(--sun);color:#5a4406;font-weight:800;font-size:.75rem;padding:.15em .55em;border-radius:999px}
.loose-sub{color:var(--muted);font-weight:700;font-size:.82rem;margin:0 0 6px}
.loose-empty{color:var(--muted);font-weight:700;font-size:.9rem;padding:6px 0}
.loose-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.loose-row .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;cursor:pointer}
.loose-row .box:hover{border-color:var(--acabada)}
.loose-row .box .icon{width:13px;height:13px;stroke:var(--acabada);stroke-width:3.5;opacity:0}
.loose-row .box:hover .icon{opacity:.55}
.loose-txt{flex:1;font-weight:700;color:var(--teal-ink);font-size:.92rem;line-height:1.3}
.loose-origin{background:var(--panel-2);border:none;color:var(--teal);font-weight:800;font-size:.74rem;padding:.4em .65em;border-radius:9px;white-space:nowrap;cursor:pointer;flex:none}
.loose-origin:hover{background:#d7eff5}

.task .origin{display:inline-flex;align-items:center;gap:.3em;background:var(--panel-2);color:var(--teal);font-weight:800;font-size:.72rem;padding:.32em .55em;border-radius:9px;cursor:pointer;border:none;line-height:1}
.task .origin:hover{background:#d7eff5}
.todos-sub{font-weight:700;font-size:.72rem;color:var(--muted);margin:-2px 0 7px}
/* ---------- calaix plegable (botó llapis) ---------- */
.composer-wrap{margin-bottom:18px}
.composer-trigger{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:14px;padding:10px 16px;font-weight:800;color:var(--teal);box-shadow:var(--shadow-sm);transition:.15s}
.composer-trigger:hover{border-color:var(--cyan);transform:translateY(-1px)}
.composer-trigger.active{background:linear-gradient(180deg,var(--cyan),#38B4D2);color:#063341;border-color:transparent}
.composer-trigger .icon{width:18px;height:18px;stroke-width:2.6}
.composer.composer-collapsed{display:none;margin-bottom:0;margin-top:12px}
.composer.composer-collapsed.open{display:block;animation:sdown .22s ease}
.composer-close-row{display:flex;justify-content:flex-end;margin-bottom:8px}
.composer-close{display:inline-flex;align-items:center;gap:.35em;background:var(--panel-2);border:none;border-radius:10px;
  color:var(--muted);font-weight:800;font-size:.78rem;padding:.4em .7em}
.composer-close .icon{width:14px;height:14px;stroke-width:2.6}
.composer-close:hover{background:#fbeaf1;color:var(--cristina)}

.todo .status{font-size:.66rem;font-weight:800;padding:.15em .5em;border-radius:999px;color:#fff;flex:none}

/* ---------- ENLLAÇOS (botons) ---------- */
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.link-card{position:relative;display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .15s,box-shadow .2s,border-color .2s;min-height:66px}
.link-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--cyan)}
.link-card .li{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.link-card .li .icon{width:20px;height:20px;stroke:#fff;stroke-width:2.4}
.link-card .ln{font-family:var(--font-d);font-weight:600;font-size:1rem;color:var(--teal-ink);line-height:1.15;flex:1;min-width:0;padding-right:34px;word-break:break-word}
.link-card .tools{position:absolute;top:7px;right:7px;display:flex;gap:2px;opacity:0;transition:opacity .15s}

/* ---------- CALENDARI ---------- */
.cal-toggle{display:inline-flex;background:var(--panel-2);border-radius:14px;padding:4px;gap:3px;margin-bottom:16px}
.cal-tab{position:relative;display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;color:var(--muted);font-weight:800;
  font-size:.88rem;padding:.5em .95em;border-radius:11px;transition:.15s}
.cal-tab .icon{width:16px;height:16px;stroke-width:2.4}
.cal-tab.on{background:#fff;color:var(--teal);box-shadow:var(--shadow-sm)}
.cal-tab .tab-badge{position:absolute;top:-6px;right:-5px;background:#EC6A88;color:#fff;min-width:18px;height:18px;

.cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;padding:2px 2px}

.cal-daybox .d{font-size:1.5rem;font-weight:600;line-height:1}

.cal-time{display:inline-flex;align-items:center;gap:.35em;color:var(--teal);font-weight:800;font-size:.82rem;margin-top:2px}
.cal-monthhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-nav{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);color:var(--teal);font-size:1.3rem;font-weight:800;line-height:1;box-shadow:var(--shadow-sm)}
.cal-nav:hover{border-color:var(--cyan)}
.cal-monthtitle{font-family:var(--font-d);font-weight:600;font-size:1.3rem;color:var(--teal-ink);flex:1}
.cal-today{border:1.5px solid var(--line);background:var(--panel);color:var(--teal);font-weight:800;border-radius:11px;padding:.5em .9em;box-shadow:var(--shadow-sm)}
.cal-today:hover{border-color:var(--cyan)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{text-align:center;font-weight:800;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.cal-cell{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden}
.cal-cell:hover{border-color:var(--cyan)}
.cal-cell.blank{background:transparent;border:none;cursor:default}
.cal-cell.today{border-color:var(--sun-deep);background:#fffdf3}
.cal-num{font-weight:800;font-size:.82rem;color:var(--teal-ink);align-self:flex-start;padding:1px 5px;border-radius:7px}
.cal-cell.today .cal-num{background:var(--sun-deep);color:#fff}
.cal-chip{border:none;color:#fff;font-weight:700;font-size:.68rem;text-align:left;padding:.25em .4em;border-radius:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.25}
.cal-chip:hover{filter:brightness(1.06)}
.cal-more{font-weight:800;font-size:.66rem;color:var(--muted);padding-left:3px}
.cal-hol-cell{background:#eef1f3;border-color:#dfe4e7}
.cal-hol-cell .cal-num{color:#7c8a92}
.cal-hol{background:#9aa6ad;color:#fff;font-weight:800;font-size:.66rem;text-align:left;padding:.22em .4em;border-radius:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.cal-tarda-cell{background:#f6f4ef}
.cal-hol.tarda{background:#e4ded2;color:#6a5f45}
@media(max-width:620px){

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:70;

<script>
/* ============================================================
   CONFIGURACIÓ

   Mentre estigui buit, funciona en MODE DEMO (dades d'exemple).
   ============================================================ */
const CONFIG = {

/* ---------- GRUPS (per al calendari) ---------- */
const GROUPS = [
  {id:'general', name:'General', color:'#43A96B'},

  {id:'2nb',     name:'2nB',     color:'#EE9B4C'},  // Mireia
  {id:'2nc',     name:'2nC',     color:'#5A6FE0'},  // Pol

}

/* ---------- AVALUACIÓ (trimestres · assignatures · frases) ---------- */
const TRIMESTRES=[{id:'t1',name:'1r trimestre'},{id:'t2',name:'2n trimestre'},{id:'t3',name:'3r trimestre'}];
const AV_SUBJECTS_BASE=[
  {id:'mates',   name:'Matemàtiques',    levels:['AE','AN','AS','NA']},
  {id:'catala',  name:'Català',          levels:['AE','AN','AS','NA']},
  {id:'medi',    name:'Medi',            levels:['AE','AN','AS','NA']},
  {id:'carpeta', name:'Carpeta Viatgera',levels:['Molt assolit','Assolit','No assolit']},
  {id:'lectura', name:'Lectura',         levels:['Verds Clars','Verds Foscs','Taronges-Roses','Vermells']},
  {id:'trac',    name:'Traç',            levels:['Molt assolit','Assolit','No assolit']},
];
const AV_VEU={id:'veu', name:'Veu de l\u2019alumne', levels:['Molt ben fet','Ben fet','Regular']};
const AV_PI={id:'pi', name:'Alumnes amb PI', pi:true};
function subjectsForTri(triId){
  const list=[...AV_SUBJECTS_BASE];
  if(triId==='t2') list.push(AV_VEU);
  list.push(AV_PI);
  return list;
}
const PI_DEFAULTS=[
  {name:'Pepito', phrase:'En Pepito segueix un Pla Individualitzat (PI) metodològic, derivat per l\u2019informe de NEE de l\u2019Equip d\u2019Assessorament Psicopedagògic (EAP).'},
  {name:'Juanito', phrase:'En Juanito segueix un Pla Individualitzat (PI) metodològic, derivat per l\u2019informe de NEE de l\u2019Equip d\u2019Assessorament Psicopedagògic (EAP).'},
];
function buildDefaultAvaluacio(){
  const av={};
  TRIMESTRES.forEach(t=>{
    av[t.id]={};
    subjectsForTri(t.id).forEach(subj=>{
      if(subj.pi) av[t.id][subj.id]=PI_DEFAULTS.map(p=>({id:uid(),name:p.name,phrase:p.phrase}));
      else av[t.id][subj.id]=(subj.levels||['AE','AN','AS','NA']).map(l=>({id:uid(),name:l,phrase:''}));
    });
  });
  return av;
}
function avGetLevels(tri,subjId){
  STATE.avaluacio=STATE.avaluacio||{};
  STATE.avaluacio[tri]=STATE.avaluacio[tri]||{};
  if(!STATE.avaluacio[tri][subjId]){
    const subj=subjectsForTri(tri).find(s=>s.id===subjId);
    if(subj && subj.pi) STATE.avaluacio[tri][subjId]=PI_DEFAULTS.map(p=>({id:uid(),name:p.name,phrase:p.phrase}));
    else STATE.avaluacio[tri][subjId]=(subj&&subj.levels?subj.levels:['AE','AN','AS','NA']).map(l=>({id:uid(),name:l,phrase:''}));
  }
  return STATE.avaluacio[tri][subjId];
}
function triName(id){ const t=TRIMESTRES.find(x=>x.id===id); return t?t.name:''; }

/* ---------- SECCIONS ---------- */
const ICONS = {
  general:'<path d="M4 5h16M4 12h16M4 19h10"/>',
  tasques:'<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
  activitats:'<path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.5-.8z"/>',
  projectes:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v7l9 4 9-4V7"/>',
  correus:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  avaluacio:'<path d="M9 3h6l1 4H8z"/><path d="M6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M9 13l2 2 4-4"/>',
  enllacos:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  calendari:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>',
  excursions:'<path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  siei:'<path d="M12 20s-6.5-4.3-9-8.2A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 9 5.8C18.5 15.7 12 20 12 20z"/>',
  agendar:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 1.5"/>',
  eines:'<path d="M14.5 6.5a3.5 3.5 0 0 0-4.6 4.6L3 18l3 3 6.9-6.9a3.5 3.5 0 0 0 4.6-4.6l-2.3 2.3-2.2-.5-.5-2.2z"/>',
  comandes:'<path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
  programacio:'<path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M13 5l-2 14"/>',
};
const SECTIONS = [
  {id:'general',    name:'Aspectes generals', type:'entries', color:'#14657F', size:'big', rich:true, desc:'El calaix de sastre: acords, informacions i tot allò que no encaixa enlloc més.', ico:'general'},
  {id:'tasques',    name:'Tasques',           type:'tasks',   color:'#4F9BDE', size:'big', desc:'Qui fa què i com va. Pendent, en procés o acabada.', ico:'tasques'},
  {id:'calendari',  name:'Calendari',         type:'agenda',  color:'#E9B93A', size:'big', desc:'Dates clau, i coses per agendar que encara no en tenen.', ico:'calendari'},
  {id:'projectes',  name:'Projectes',         type:'subthemes', color:'#EE9B4C', size:'reg', rich:true, desc:'Els projectes de curs, cadascun amb el seu espai de seguiment.', ico:'projectes'},
  {id:'excursions', name:'Excursions',        type:'subthemes', color:'#8763D6', size:'reg', rich:true, desc:'Cada sortida té el seu subtema. Afegeix-ne o esborra\u2019n segons calgui.', ico:'excursions'},
  {id:'activitats', name:'Activitats i festes', type:'subthemes', color:'#4CB782', size:'reg', rich:true, desc:'Festes i tradicions del curs, cada una amb el seu subtema.', ico:'activitats'},
  {id:'correus',    name:'Correus', type:'correus', color:'#D5638E', size:'reg', customHero:true, desc:'Correus a enviar: assumpte, cos, dia i seguiment.', ico:'correus'},
  {id:'eines',      name:'Eines',             type:'eines', color:'#6E7B8C', size:'reg', customHero:true, desc:'Eines pràctiques per al dia a dia.', ico:'eines'},
  {id:'comandes',   name:'Comandes',          type:'entries', color:'#C77D4A', size:'reg', customHero:true, desc:'Comandes de material del curs, guardades a la carpeta compartida.', ico:'comandes'},
  {id:'enllacos',   name:'Enllaços d\u2019interès', type:'links', color:'#2E9AA8', size:'reg', desc:'Botons d\u2019accés directe a webs i documents que feu servir sovint.', ico:'enllacos'},

];
const secById = id => SECTIONS.find(s=>s.id===id);

/* ============================================================
   CAPA DE DADES  (async: preparada per a Google Sheets)
   ============================================================ */
const STORE_KEY = 'coordinacio_2n_demo_v17';
let STATE = { entries:[], tasks:[], subthemes:[] };

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const slug = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();

function safeLoad(){ try{ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function safeSave(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){} }

/* --- API única: avui DEMO, demà Sheets (mateixa firma) --- */
const api = {
  async init(){
    if(DEMO_MODE){
      const cached = safeLoad();
      STATE = cached || seed();
      normalizeState();
      if(!cached) safeSave();
      return STATE;
    }
    // ---------- MODE NÚVOL (Google Sheets) ----------
    try{
      const state = await request('getState');
      STATE = state || {entries:[],tasks:[],subthemes:[],avaluacio:{}};
      normalizeState();
      // primera arrencada: si el full és buit, hi sembra els subtemes per defecte
      if(!STATE.subthemes || !STATE.subthemes.length){
        STATE.subthemes = buildDefaultSubthemes();
        await request('setSubthemes', STATE.subthemes);
      }
      if(!STATE.avaluacio || !Object.keys(STATE.avaluacio).length){
        STATE.avaluacio = buildDefaultAvaluacio();

/* ---- Cua de mutacions no sincronitzades (robustesa davant talls de xarxa) ---- */
let PENDING = [];
function _loadPending(){ try{ return JSON.parse(localStorage.getItem('coord_pending')||'[]'); }catch(e){ return []; } }
function _savePending(){ try{ localStorage.setItem('coord_pending', JSON.stringify(PENDING)); }catch(e){} }
async function flushPending(){
  if(DEMO_MODE || !PENDING.length) return true;
  while(PENDING.length){
    try{ await request(PENDING[0].action, PENDING[0].payload); PENDING.shift(); _savePending(); }
    catch(e){ return false; }   // encara sense xarxa: es reintentar\u00e0 m\u00e9s tard
  }
  return true;
}
async function persist(action, payload){
  if(DEMO_MODE){ safeSave(); return; }
  safeSave();                                  // cache local immediata (optimista)
  try{
    if(PENDING.length) await flushPending();   // primer, el que hi hagu\u00e9s pendent (en ordre)
    await request(action, payload);
  }catch(err){
    PENDING.push({action, payload}); _savePending();
    const now=Date.now(); if(now-(window._offAt||0)>4000){ window._offAt=now; toast('\u26A0\uFE0F Sense connexi\u00f3: es desar\u00e0 sol quan torni'); }
  }
}

/* crida a l'Apps Script (POST text/plain → sense preflight de CORS) */
async function request(action, payload){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 15000);
  try{
    const res = await fetch(CONFIG.WEB_APP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, payload, secret:CONFIG.SECRET}),
      signal: ctrl.signal
    });
    const data = await res.json();
    if(data && data.error) throw new Error(data.error);
    return data;
  } finally { clearTimeout(timer); }
}

let _lastSig = '';
function startCloudSync(){
  if(DEMO_MODE) return;
  const pull=async()=>{
    if(document.hidden || $('#home').classList.contains('hidden')) return;
    if(!(await flushPending())) return;          // si hi ha canvis locals sense enviar, NO sobreescriguis res
    try{ const s=await request('getState');
      if(s){ const sig=JSON.stringify(s);
        if(sig!==_lastSig){ _lastSig=sig; STATE=s; normalizeState(); safeSave(); refreshHome(); } } }catch(e){}
  };
  setInterval(pull, 20000);
  window.addEventListener('focus', ()=>{ flushPending(); pull(); });
  window.addEventListener('online', flushPending);
}

let ME = null;
const $ = s => document.querySelector(s);
const el = (t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n;};
const fmtDate = iso => new Date(iso).toLocaleDateString('ca-ES',{day:'numeric',month:'short'});
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stripHtml = s => (s||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
function sanitizeHtml(html){
  const tpl=document.createElement('template'); tpl.innerHTML=html||'';
  const allowed=new Set(['P','BR','B','STRONG','I','EM','U','UL','OL','LI','TABLE','THEAD','TBODY','TR','TH','TD','DIV','SPAN','A','H4','H5']);
  const walk=node=>{
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===1){
        if(!allowed.has(ch.nodeName)){ node.replaceChild(document.createTextNode(ch.textContent), ch); return; }
        Array.from(ch.attributes).forEach(a=>{
          const n=a.name.toLowerCase();
          const keep = (ch.nodeName==='A' && n==='href' && !/^\s*javascript:/i.test(a.value));
          if(!keep) ch.removeAttribute(a.name);
        });
        if(ch.nodeName==='A'){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener'); }
        walk(ch);
      }
    });
  };
  walk(tpl.content);
  return tpl.innerHTML;
}

function insertTable(ed){
  let html='<table><thead><tr><th>Títol</th><th>Títol</th></tr></thead><tbody>';
  html+='<tr><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr>';
  html+='</tbody></table><p><br></p>';
  document.execCommand('insertHTML', false, html);
}
function currentTable(ed){
  const sel=window.getSelection(); if(!sel || !sel.rangeCount) return ed.querySelector('table');
  let n=sel.anchorNode; while(n && n!==ed){ if(n.nodeName==='TABLE') return n; n=n.parentNode; }
  return ed.querySelector('table');
}
function tableAddRow(ed){
  const t=currentTable(ed); if(!t){ toast('Primer insereix una taula'); return; }
  const body=t.tBodies[0]||t; const cols=t.rows[0]?t.rows[0].cells.length:1;
  const tr=document.createElement('tr'); for(let i=0;i<cols;i++){ const td=document.createElement('td'); td.innerHTML='&nbsp;'; tr.appendChild(td); }
  body.appendChild(tr);
}
function tableAddCol(ed){
  const t=currentTable(ed); if(!t){ toast('Primer insereix una taula'); return; }
  Array.from(t.rows).forEach(row=>{ const isHead=row.parentNode && row.parentNode.nodeName==='THEAD';
    const cell=document.createElement(isHead?'th':'td'); cell.innerHTML=isHead?'Títol':'&nbsp;'; row.appendChild(cell); });
}
function tableDelRow(ed){
  const t=currentTable(ed); if(!t){ return; }
  const body=t.tBodies[0]; if(body && body.rows.length>0) body.deleteRow(body.rows.length-1); else t.remove();
}
function tableDelCol(ed){
  const t=currentTable(ed); if(!t){ return; }
  const cols=t.rows[0]?t.rows[0].cells.length:0;
  if(cols<=1){ t.remove(); return; }
  Array.from(t.rows).forEach(row=>{ if(row.cells.length) row.deleteCell(row.cells.length-1); });
}

/* ---------- popup de confirmació global ---------- */
let _confirmCb=null;
function askConfirm(message, onYes, opts){
  opts=opts||{};
  $('#confirmTitle').textContent=opts.title||'Segur que ho vols esborrar?';
  $('#confirmMsg').textContent=message||'Aquesta acció no es pot desfer.';
  $('#confirmYes').textContent=opts.confirmLabel||'Esborra';
  _confirmCb=onYes;
  $('#confirm').classList.add('open');
}
function closeConfirm(){ $('#confirm').classList.remove('open'); _confirmCb=null; }
(function wireConfirm(){
  $('#confirmNo').onclick=closeConfirm;
  $('#confirmYes').onclick=()=>{ const cb=_confirmCb; closeConfirm(); if(cb)cb(); };
  $('#confirm').addEventListener('click',e=>{ if(e.target.dataset.cclose!==undefined) closeConfirm(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#confirm').classList.contains('open')) closeConfirm(); });
})();

/* Modal de text reutilitzable. onConfirm(valor): si retorna false, el modal queda obert (validació). */
function askPrompt(opts, onConfirm){
  opts=opts||{};
  const modal=el('div','modal open');
  const scrim=el('div','scrim'); modal.appendChild(scrim);
  const box=el('div','modal-box');
  box.innerHTML=`<div class="modal-ico">${opts.icon||'\u270F\uFE0F'}</div><h3>${esc(opts.title||'')}</h3>`+(opts.label?`<p>${esc(opts.label)}</p>`:'');
  const inp=el('input','input'); inp.type=opts.inputType||'text'; if(opts.placeholder) inp.placeholder=opts.placeholder; inp.value=opts.value||'';
  inp.style.marginBottom='18px'; inp.style.textAlign='center';
  box.appendChild(inp);
  const acts=el('div','modal-actions');
  const no=el('button','btn btn-ghost'); no.type='button'; no.textContent=opts.cancelLabel||'Cancel\u00b7la';
  const yes=el('button','btn btn-primary'); yes.type='button'; yes.textContent=opts.confirmLabel||'D\u2019acord';
  acts.appendChild(no); acts.appendChild(yes); box.appendChild(acts);
  modal.appendChild(box); document.body.appendChild(modal);
  const close=()=>modal.remove();
  const submit=()=>{ const r=onConfirm?onConfirm(inp.value):true; if(r!==false) close(); };
  no.onclick=close; scrim.onclick=close; yes.onclick=submit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } else if(e.key==='Escape'){ close(); } });
  setTimeout(()=>inp.focus(),40);
}

/* burst dashes generator */
function makeBurst(container,count,radiusMin,radiusMax,cx,cy){
  container.innerHTML='';
  for(let i=0;i<count;i++){
    const ang=(Math.PI*2*i/count)+Math.random()*.4;
    const len=8+Math.random()*14;
    const r=radiusMin+Math.random()*(radiusMax-radiusMin);
    const s=el('span');
    s.style.height=len+'px';
    s.style.left=cx+'%'; s.style.top=cy+'%';
    s.style.transform=`translate(-50%,-50%) rotate(${ang}rad) translateY(-${r}px)`;
    s.style.opacity=(.35+Math.random()*.5).toFixed(2);
    container.appendChild(s);
  }
}

function novItems(){
  const out=[];
  const isEdited = x => !!(x.updatedAt && x.createdAt && x.updatedAt!==x.createdAt);
  STATE.entries.forEach(e=>{ if(!(e.readBy||[]).includes(ME))
    out.push({kind:'entry',ref:e,id:e.id,section:e.section,title:e.title,snippet:e.body,author:e.author,
      updatedAt:e.updatedAt||e.date,edited:isEdited(e)}); });
  STATE.tasks.forEach(t=>{ if(!(t.readBy||[]).includes(ME))
    out.push({kind:'task',ref:t,id:t.id,section:'tasques',title:t.title,snippet:t.desc,author:t.author,
      updatedAt:t.updatedAt||t.date,edited:isEdited(t)}); });
  Object.keys(STATE.comments||{}).forEach(entryId=>{
    const entry=STATE.entries.find(e=>e.id===entryId); if(!entry) return;
    const units=[];
    (STATE.comments[entryId]||[]).forEach(t=>{
      if(t.author!==ME && !(t.seenBy||[]).includes(ME)) units.push({author:t.author,text:t.text,createdAt:t.createdAt});
      (t.replies||[]).forEach(r=>{ if(r.author!==ME && !(r.seenBy||[]).includes(ME)) units.push({author:r.author,text:r.text,createdAt:r.createdAt}); });
    });
    if(!units.length) return;
    units.sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));
    const latest=units[0];
    out.push({kind:'comment',ref:entry,id:entry.id,section:entry.section,
      title: entry.title || stripHtml(entry.body||'').slice(0,50),
      snippet: latest.text, author: latest.author,
      updatedAt: latest.createdAt || entry.updatedAt || entry.date, edited:false, count:units.length});
  });
  out.sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt));
  return out;
}

  if(sec.type==='subthemes'){ const n=STATE.subthemes.filter(s=>s.section===sec.id).length; return n? `${n} subtemes` : 'Sense subtemes'; }
  if(sec.type==='links'){ const n=STATE.entries.filter(e=>e.section===sec.id).length; return n? `${n} enllaç${n===1?'':'os'}` : 'Cap enllaç'; }
  if(sec.type==='agenda'){ const dated=STATE.entries.filter(e=>e.section===sec.id&&e.eventDate).length; const pend=STATE.entries.filter(e=>e.section===sec.id&&!e.eventDate).length; return pend? `${dated} dates · ${pend} per agendar` : `${dated} dates`; }
  if(sec.type==='avaluacio'){ return 'Frases per trimestre'; }
  if(sec.type==='programacio'){ return 'Setmanal · 3 assignatures'; }
  if(sec.type==='correus'){ const n=(STATE.correus||[]).filter(c=>!(c.sent&&c.sent[ME])).length; return n? (n+' per enviar') : 'Tot enviat'; }
  const n=STATE.entries.filter(e=>e.section===sec.id).length;
  return n? `${n} entrad${n===1?'a':'es'}` : 'Encara buit';
}
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16); let r=(n>>16),g=(n>>8&255),b=(n&255);
  r=Math.max(0,Math.min(255,r+pct*2.55|0));g=Math.max(0,Math.min(255,g+pct*2.55|0));b=Math.max(0,Math.min(255,b+pct*2.55|0));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function reptSeedNorm(x){ return {id:x.id, materia:x.m, codi:x.c, tema:x.t, nivell:x.n, num:x.num,
  nom:x.nom, nn:x.nn, d:x.d, ordre:x.num}; }
/* Entrada de TEMA: hi viuen les CÒPIES i la fitxa imprimible, perquè la fitxa
   és la mateixa per als 3 nivells del tema (una fitxa per alumne i nivell fet). */
function reptTemaNorm(x){ return {id:x.id, tipus:'tema', codi:x.id, materia:x.m, tema:x.t,
  nom:x.nom, d:x.d, fitxa:x.f, estoc:10, low:3, eval:false}; }
const REPTES_SEED_V=3;   // puja aquest número si canvia la llista de caixes
/* Sembra/actualitza la llista AL NÚVOL (conserva registres i estoc).
   `caixes` conté entrades de TEMA (id='M-01') i de NIVELL (id='mat-t01-n2'). */
function reptesLoad(){
  const R=reptesState();
  if(!R.caixes.length || R.v!==REPTES_SEED_V){
    const prev={}; R.caixes.forEach(c=>{ prev[c.id]=c; });
    const temes=(typeof REPTES_TEMES!=='undefined'?REPTES_TEMES:[]).map(x=>{
      const c=reptTemaNorm(x); const p=prev[c.id];
      if(p){ if(typeof p.estoc==='number') c.estoc=p.estoc; if(typeof p.low==='number') c.low=p.low; if(p.eval) c.eval=true; }
      return c; });
    R.caixes=temes.concat(REPTES_SEED.map(reptSeedNorm));
    R.v=REPTES_SEED_V;
    if(!DEMO_MODE) api.reptSetCaixes(R.caixes, R.v).catch(()=>{}); else safeSave();
  }
  reptMigraLocal(R);
}
/* Migració UNA SOLA VEGADA dels registres que hi hagués al dispositiu (maqueta)
   cap al núvol. Només els de caixes que encara existeixen; després es marca com a
   feta perquè no es repeteixi ni ressusciti res esborrat. */
function reptMigraLocal(R){
  try{
    if(localStorage.getItem('coord_reptes_migrat')==='1') return;
    const old=JSON.parse(localStorage.getItem('coord_reptes')||'null');
    const regs=(old && old.registres) ? old.registres : [];
    const vius=regs.filter(r=>r && r.caixa && R.caixes.some(c=>c.id===r.caixa)
                              && !R.registres.some(x=>x.id===r.id));
    vius.forEach(r=>{ R.registres.push(r); if(!DEMO_MODE) api.reptRegUpsert(r); });
    localStorage.setItem('coord_reptes_migrat','1');
    if(vius.length) toast(vius.length+' registres del racó migrats al núvol');
  }catch(e){}
}
function reptesSave(){ safeSave(); }   // còpia local; el desat real va per api.rept*
function reptCaixa(id){ return REPTES.caixes.find(c=>c.id===id); }
function reptRegsDe(id){ return REPTES.registres.filter(r=>r.caixa===id); }
function reptFetsDe(id){ return reptRegsDe(id).filter(r=>r.estat==='fet').length; }
/* --- TEMES: les còpies i la fitxa són per tema (compartides pels 3 nivells) --- */
function reptEsTema(c){ return !!(c && c.tipus==='tema'); }
function reptTemes(){ return REPTES.caixes.filter(reptEsTema); }
function reptNivellsDe(codi){ return REPTES.caixes.filter(c=>!reptEsTema(c) && c.codi===codi); }
/* Donat un tema o un nivell, retorna sempre l'entrada de TEMA */
function reptTemaDe(c){ if(!c) return null; return reptEsTema(c) ? c : (reptCaixa(c.codi)||null); }
/* Fitxes consumides d'un tema = registres de TOTS els seus nivells */
function reptUsadesTema(codi){ return REPTES.registres.filter(r=>{ const n=reptCaixa(r.caixa); return n && n.codi===codi; }).length; }
function reptQueden(c){ const t=reptTemaDe(c); if(!t) return 0; return Math.max(0, (t.estoc||0)-reptUsadesTema(t.codi)); }
function reptLow(c){ const t=reptTemaDe(c); return t ? reptQueden(t)<=(t.low||3) : false; }
function reptAllStudents(){ const set=new Set(); Object.values(STATE.students||{}).forEach(a=>(a||[]).forEach(n=>set.add(n))); REPTES.registres.forEach(r=>set.add(r.alumne)); return [...set].sort((a,b)=>a.localeCompare(b,'ca')); }
function reptUrl(id){ return location.origin+location.pathname+'?repte='+encodeURIComponent(id); }
function reptRegDe(caixa, alumne){ return REPTES.registres.find(r=>r.caixa===caixa && (r.alumne||'').toLowerCase()===(alumne||'').toLowerCase()); }

function collapsibleComposer(composerEl, label){
  const wrap=el('div','composer-wrap');

  trigger.innerHTML=`<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14 6l4 4"/></svg><span>${esc(label)}</span>`;
  composerEl.classList.add('composer-collapsed');
  const closeRow=el('div','composer-close-row');
  const close=el('button','composer-close'); close.type='button'; close.title='Tanca sense desar';
  close.innerHTML=`<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Tanca`;
  close.onclick=()=>{
    composerEl.classList.remove('open'); trigger.classList.remove('active');
    composerEl.querySelectorAll('input,textarea').forEach(i=>{ i.value=''; });
    composerEl.querySelectorAll('select').forEach(s=>{ s.selectedIndex=0; });
    composerEl.querySelectorAll('.rich-ed').forEach(e=>{ e.innerHTML=''; });
  };
  closeRow.appendChild(close);
  composerEl.insertBefore(closeRow, composerEl.firstChild);
  trigger.onclick=()=>{
    const open=composerEl.classList.toggle('open');
    trigger.classList.toggle('active',open);
    if(open){ const inp=composerEl.querySelector('input,textarea,select'); if(inp) setTimeout(()=>inp.focus(),60); }
  };
  wrap.appendChild(trigger); wrap.appendChild(composerEl);
  return wrap;
}

function cvCurrentGive(){ const today=progDateToISO(new Date());

function cvUpcoming(){
  const now=new Date(); now.setHours(0,0,0,0);
  const monday=new Date(now); monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
  const sunday=new Date(monday); sunday.setDate(sunday.getDate()+6);
  const items=[];
  CV_GIVES.forEach(g=>{
    const gd=progIsoToDate(g); gd.setHours(0,0,0,0); const gdiff=Math.round((gd-now)/86400000);
    const giveThisWeek = gd>=monday && gd<=sunday;
    if(gdiff===0){ items.push({type:'donar', iso:g, give:g, days:0}); }
    else if(giveThisWeek && gdiff>0 && !cvHasContent(g)){ items.push({type:'programar', iso:g, give:g, days:gdiff}); }

    if(p) return p.items.map(progNormItem);

async function progMaterializeSeed(subject){
  if(typeof PROG_SEED==='undefined' || !PROG_SEED[subject]) return;
  const old=(STATE.programacio&&STATE.programacio[subject])||{};
  const map=Object.assign({}, old); let changed=false;
  progTeachingMondays().forEach(k=>{
    const cur=map[k];
    if(cur && cur.items && cur.items.length) return;
    const seed=progSeedItems(subject,k);

function progComputeShift(subject, fromMonday, dir){
  const T=progTeachingMondays(); const fi=T.indexOf(fromMonday);
  if(fi<0) return null;
  const old=(STATE.programacio&&STATE.programacio[subject])||{};
  const cells=T.map(k=> old[k]?JSON.parse(JSON.stringify(old[k])):null );
  let dropped=false;
  if(dir>0){
    if(progCellHasContent(cells[cells.length-1])) dropped=true;
    for(let i=cells.length-1;i>fi;i--) cells[i]=cells[i-1];
    cells[fi]=null;
  }else{
    for(let i=fi;i<cells.length-1;i++) cells[i]=cells[i+1];
    cells[cells.length-1]=null;
  }
  const map={};
  Object.keys(old).forEach(k=>{ if(T.indexOf(k)<0) map[k]=old[k]; });
  T.forEach((k,i)=>{ if(cells[i]) map[k]=cells[i]; });
  return {map, dropped};
}

async function doProgCarry(subject, fromMonday, items){
  const T=progTeachingMondays(); const fi=T.indexOf(fromMonday);
  if(fi<0 || fi>=T.length-1){ toast('No hi ha setmana seg\u00fcent'); return; }
  const nextKey=T[fi+1];
  const pending=items.filter(it=>!progItemDoneBy(it, ME) && String(it.t).trim()).map(it=>({t:it.t, done:Object.assign({}, it.done||{}), c:true}));
  if(!pending.length){ toast('No hi ha res pendent'); return; }
  const remain=items.filter(it=>progItemDoneBy(it, ME) && String(it.t).trim()).map(it=>({t:it.t, done:Object.assign({}, it.done||{}), c:!!it.c}));
  const thisCell=progCell(subject, fromMonday);
  const nextCell=progCell(subject, nextKey);
  const nextItems=progItemsOf(nextCell).map(x=>({t:x.t||'',done:Object.assign({},x.done||{}),c:!!x.c})).concat(pending);
  try{
    await api.progSetCell(subject, fromMonday, {items:remain, notes:thisCell.notes||'', link:thisCell.link||''});
    await api.progSetCell(subject, nextKey, {items:nextItems, notes:nextCell.notes||'', link:nextCell.link||''});
  }catch(e){}
  openSection('programacio');
  toast('Pendent passat a la setmana seg\u00fcent \u2713');
}

let CV_IDX=null;
let CV_VIEW='cycle';
function cvDateLabel(iso){ const p=String(iso).split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString('ca-ES',{weekday:'short',day:'numeric',month:'short'}); }
function progItemListEl(subject, key){
  const wrap=el('div','prog-items');
  let items = progItemsView(subject,key).map(x=>Object.assign({}, x, {done:Object.assign({},x.done||{})}));
  const save=()=>{ const cell=progCell(subject,key); api.progSetCell(subject, key, {items:items, notes:cell.notes||'', link:cell.link||''}).catch(()=>{}); };
  function render(focus){
    wrap.innerHTML='';
    items.forEach((it,i)=>{
      const row=el('div','pit'+(it.done[ME]?' done':''));
      const dots=el('div','pit-dots');
      USERS.forEach(u=>{ const on=!!it.done[u.id]; const d=el('button','pdot'+(on?' on':'')); d.type='button'; d.style.setProperty('--c',u.accent); d.title=u.name; d.innerHTML='<i></i>';
        d.onclick=()=>{ if(it.done[u.id]) delete it.done[u.id]; else it.done[u.id]=true; render(); save(); }; dots.appendChild(d); });
      row.appendChild(dots);
      row.appendChild(progItemTags(it));
      const inp=el('input','pit-inp'); inp.type='text'; inp.value=it.t; inp.placeholder='Deure\u2026';
      inp.addEventListener('blur',()=>{ if(it.t!==inp.value){ it.t=inp.value; save(); } });
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); it.t=inp.value; items.splice(i+1,0,{id:uid(),t:'',done:{}}); render(i+1); save(); }
        else if(e.key==='Backspace'&&inp.value===''&&items.length>1){ e.preventDefault(); items.splice(i,1); render(Math.max(0,i-1)); save(); } });
      row.appendChild(inp);
      const del=el('button','pit-del'); del.type='button'; del.innerHTML='\u00d7'; del.title='Elimina'; del.onclick=()=>{ items.splice(i,1); render(); save(); }; row.appendChild(del);
      wrap.appendChild(row);
    });
    const add=el('button','pit-add'); add.type='button'; add.innerHTML='+ Afegeix un deure'; add.onclick=()=>{ items.push({id:uid(),t:'',done:{}}); render(items.length-1); }; wrap.appendChild(add);
    if(focus!=null){ const ins=wrap.querySelectorAll('.pit-inp'); if(ins[focus]) ins[focus].focus(); }
  }
  render();
  return wrap;
}
function renderCarpeta(S, subj){
  const seg=el('div','prog-seg');

  b1.onclick=()=>{ CV_VIEW='cycle'; openSection('programacio'); };
