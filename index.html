  if(CV_VIEW==='all'){ renderCarpetaOverview(S, subj); return; }

  if(CV_IDX==null){ const cg=cvCurrentGive(); CV_IDX=Math.max(0, CV_GIVES.indexOf(cg)); }
  if(CV_IDX<0) CV_IDX=0; if(CV_IDX>CV_GIVES.length-1) CV_IDX=CV_GIVES.length-1;
  const curGive=cvCurrentGive();
  const give=CV_GIVES[CV_IDX]; const collect=cvCollectOf(give);

  const nav=el('div','prog-nav');
  const prev=el('button','prog-navbtn'); prev.type='button'; prev.innerHTML='\u2039'; prev.disabled=CV_IDX<=0;
  prev.onclick=()=>{ if(CV_IDX>0){ CV_IDX--; openSection('programacio'); } };
  const sel=el('select','prog-weeksel');
  CV_GIVES.forEach((g,idx)=>{ const o=el('option'); o.value=idx; const tt=(progCell('carpeta',g).title||'').trim();
    o.textContent='Cicle '+(idx+1)+' \u00b7 '+(tt||('dona '+cvDateLabel(g)))+(g===curGive?'  \u2022 ara':''); if(idx===CV_IDX) o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ CV_IDX=+sel.value; openSection('programacio'); };
  const next=el('button','prog-navbtn'); next.type='button'; next.innerHTML='\u203a'; next.disabled=CV_IDX>=CV_GIVES.length-1;
  next.onclick=()=>{ if(CV_IDX<CV_GIVES.length-1){ CV_IDX++; openSection('programacio'); } };
  nav.appendChild(prev); nav.appendChild(sel); nav.appendChild(next); S.appendChild(nav);

  if(give!==curGive){ const jump=el('button','prog-jump'); jump.type='button'; jump.innerHTML='\u21ba Ves al cicle actual';
    jump.onclick=()=>{ CV_IDX=Math.max(0,CV_GIVES.indexOf(curGive)); openSection('programacio'); }; S.appendChild(jump); }

  const cell=progCell('carpeta', give);
  const card=el('div','prog-week'+(give===curGive?' now':'')); card.style.setProperty('--c', subj.color);
  const cap=el('div','prog-week-cap');
  cap.innerHTML='<b>Cicle '+(CV_IDX+1)+'</b><span>\uD83D\uDCC1 Dona: '+cvDateLabel(give)+' \u2192 Recull: '+cvDateLabel(collect)+(give===curGive?' \u00b7 cicle actual':'')+'</span>';
  card.appendChild(cap);

  const tWrap=el('div','prog-field'); tWrap.innerHTML='<label>T\u00edtol de la carpeta</label>';
  const ti=el('input','input'); ti.type='text'; ti.value=cell.title||''; ti.placeholder='Ex.: Carpeta Viatgera 1 \u00b7 La tardor'; ti.style.textAlign='left';
  ti.addEventListener('blur',()=>{ const c=progCell('carpeta',give); if((c.title||'')!==ti.value){ api.progSetCell('carpeta', give, {title:ti.value}).then(()=>toast('Desat \u2713')).catch(()=>{}); } });
  tWrap.appendChild(ti); card.appendChild(tWrap);

  const dl=el('div','prog-field'); dl.innerHTML='<label>Deures d\u2019aquesta carpeta</label>';
  dl.appendChild(progItemListEl('carpeta', give)); card.appendChild(dl);

  const linkWrap=el('div','prog-field'); linkWrap.innerHTML='<label>Document dels deures (Google Doc)</label>';
  const link=el('input','input'); link.type='url'; link.value=cell.link||''; link.placeholder='Enganxa l\u2019enlla\u00e7 del document de Drive\u2026'; link.style.textAlign='left';
  link.addEventListener('blur',()=>{ const c=progCell('carpeta',give); if((c.link||'')!==link.value) api.progSetCell('carpeta', give, {items:progItemsOf(c), notes:c.notes||'', link:link.value}).then(()=>toast('Desat \u2713')).catch(()=>{}); });
  linkWrap.appendChild(link);
  if(cell.link){ const open=el('a','prog-open'); open.href=cell.link; open.target='_blank'; open.rel='noopener'; open.innerHTML='\u2197 Obre el document'; linkWrap.appendChild(open); }
  card.appendChild(linkWrap);

  S.appendChild(card);
}
function renderCarpetaOverview(S, subj){
  const curGive=cvCurrentGive();
  const list=el('div','prog-list');
  CV_GIVES.forEach((g,idx)=>{
    const cell=progCell('carpeta', g);
    const items=progItemsOf(cell).filter(i=>i.t&&String(i.t).trim());
    const title=(cell.title||'').trim();
    const isEmpty = !items.length && !title && !cell.link;
    const collect=cvCollectOf(g);
    const row=el('div','prog-row'+(g===curGive?' now':'')+(isEmpty && g!==curGive?' empty':'')); row.style.setProperty('--c', subj.color);
    const main=el('div','prog-row-main'); main.title='Obre el cicle';
    const wk=el('div','prog-row-wk'); wk.innerHTML='<b>Cicle '+(idx+1)+'</b><small>'+cvDateLabel(g)+' \u2192 '+cvDateLabel(collect)+(g===curGive?' \u00b7 ara':'')+'</small>';
    main.appendChild(wk);
    const body=el('div','prog-row-body');
    const snippet=el('div','prog-row-txt'); snippet.innerHTML = title ? esc(title) : (items.length ? esc(items[0].t.slice(0,60)) : '<i>\u2014</i>');
    body.appendChild(snippet); main.appendChild(body);
    main.onclick=()=>{ CV_IDX=idx; CV_VIEW='cycle'; openSection('programacio'); };
    row.appendChild(main);
    const side=el('div','prog-row-side'); side.addEventListener('click', e=>e.stopPropagation());
    if(cell.link){ const lk=el('a','prog-link-ico'); lk.href=cell.link; lk.target='_blank'; lk.rel='noopener'; lk.title='Obre el document';
      lk.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 15l6-6"/><path d="M11 6l1-1a4 4 0 0 1 6 6l-2 2"/><path d="M13 18l-1 1a4 4 0 0 1-6-6l2-2"/></svg>'; side.appendChild(lk); }
    const dots=el('div','prog-row-dots');
    USERS.forEach(u=>{
      const all = items.length>0 && items.every(it=>it.done && it.done[u.id]);
      const d=el('button','pdot'+(all?' on':'')); d.type='button'; d.style.setProperty('--c', u.accent); d.title=u.name;
      d.innerHTML='<i></i>';
      d.onclick=(e)=>{ e.stopPropagation(); if(!items.length){ toast('Aquest cicle no t\u00e9 deures'); return; }
        const on=!d.classList.contains('on'); const its=progItemsOf(progCell('carpeta',g));
        its.forEach(it=>{ it.done=it.done||{}; if(on) it.done[u.id]=true; else delete it.done[u.id]; });
        const c=progCell('carpeta',g); api.progSetCell('carpeta', g, {items:its, notes:c.notes||'', link:c.link||''}).catch(()=>{});
        d.classList.toggle('on', on); };
      dots.appendChild(d);
    });
    side.appendChild(dots); row.appendChild(side);
    list.appendChild(row);
  });
  S.appendChild(list);
}

  card.appendChild(head);
  up.forEach(u=>{
    const row=el('div','hrow');
    const ico=el('span','hcv-ico'); ico.textContent = u.type==='programar' ? '\uD83D\uDCDD' : (u.type==='donar' ? '\uD83D\uDCE4' : '\uD83D\uDCE5');
    row.appendChild(ico);

    t.textContent = lbl + (tt?' \u00b7 '+tt:''); row.appendChild(t);

  return card;

      ()=>progMaterializeSeed(PROG_SUBJECT).then(()=>doProgCarry(PROG_SUBJECT, w.monday, items)),

function openSection(id){
  if(id!==CURRENT || CURRENT_SUB) EDITING=null;
  if(id!=='calendari') SCHEDULING=null;
  if(id!==CURRENT){ AV_TRI=null; AV_SUBJECT=null; EINA=null; GRP_RESULT=null; ATT_CLASS=null; ATT_RESULT=null; PICNIC_SUB=null; PICNIC_RESULT=null; COMANDA_NEW=false; COMANDA_EDIT=null; }
  if(id==='programacio' && id!==CURRENT){ PROG_WEEK_IDX=progCurrentIdx(); PROG_VIEW='week'; CV_IDX=null; CV_VIEW='cycle'; }
  CURRENT=id; CURRENT_SUB=null; const sec=secById(id);
  $('#home').classList.add('hidden');
  const S=$('#section'); S.classList.remove('hidden'); S.innerHTML='';
  if(!sec.customHero) buildSecHero(S,sec);
  if(sec.type==='tasks') renderTasks(S);
  else if(sec.type==='agenda') renderAgenda(S,sec);
  else if(sec.type==='subthemes') renderSubthemes(S,sec);
  else if(sec.type==='links') renderLinks(S,sec);
  else if(sec.type==='avaluacio') renderAvaluacio(S,sec);
  else if(sec.type==='programacio') renderProgramacio(S,sec);
  else if(sec.type==='correus') renderCorreus(S,sec);
  else if(sec.type==='eines') renderEines(S,sec);
  else if(sec.id==='comandes') renderComandes(S,sec);
  else renderEntries(S,sec,null);
  animateIn(S);
}

/* ---------- PÍCNICS (dins d'una excursió) ---------- */
function buildPicnicText(subId, sub){
  const pic=(STATE.picnics&&STATE.picnics[subId])||{};
  const classes=Object.keys(STATE.students||{}).filter(c=>STATE.students[c]&&STATE.students[c].length);
  const lines=['Pícnics — '+(sub?sub.name:'')+':',''];
  let total=0;
  classes.forEach(c=>{
    const list=(STATE.students[c]||[]).filter(n=>pic[n]);
    lines.push(c+':');
    if(list.length){ list.forEach(n=>lines.push('- '+n)); total+=list.length; }
    else lines.push('- (cap)');
    lines.push('');
  });
  lines.push('Total: '+total);
  return lines.join('\n');
}
function formatCatalanDate(iso){
  try{
    const p=String(iso).split('-'); const d=new Date(+p[0], +p[1]-1, +p[2]);
    const dies=['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
    const mesos=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
    return dies[d.getDay()]+', '+d.getDate()+' de '+mesos[d.getMonth()]+' de '+d.getFullYear();
  }catch(e){ return iso; }
}
function buildPicnicEmailBody(subId, sub, dia){
  const pic=(STATE.picnics&&STATE.picnics[subId])||{};
  const classes=Object.keys(STATE.students||{}).filter(c=>STATE.students[c]&&STATE.students[c].length);
  const parts=[]; let total=0;
  classes.forEach(c=>{
    const list=(STATE.students[c]||[]).filter(n=>pic[n]);
    if(list.length){ parts.push(c+':'); list.forEach(n=>parts.push('- '+n)); total+=list.length; parts.push(''); }
  });
  const llista=parts.join('\n').trim() || '(cap pícnic demanat)';
  return 'Bon dia N\u00faria,\n\n'
    + "T'envio el llistat de picnics que necessitem per al dia "+dia+'\n\n'
    + llista + '\n\n'
    + 'Total: '+total+' p\u00edcnics\n\n'
    + 'Moltes gr\u00e0cies';
}

/* ---------- EINES ---------- */
function allStudentNames(){ const b=STATE.students||{}; const out=[]; Object.keys(b).forEach(c=>(b[c]||[]).forEach(n=>out.push(n))); return out.sort((x,y)=>x.localeCompare(y,'ca')); }
function studentClass(name){ const b=STATE.students||{}; for(const c in b){ if((b[c]||[]).indexOf(name)>-1) return c; } return null; }
function classColor(cls){ if(!cls) return 'var(--muted)'; const g=GROUPS.find(x=>x.id===String(cls).toLowerCase()); return g?g.color:'var(--muted)'; }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function buildGroupOrder(students, hetero, marked){
  if(hetero){ return shuffleArr(students.filter(s=>marked[s])).concat(shuffleArr(students.filter(s=>!marked[s]))); }
  return shuffleArr(students.slice());
}
function makeGroups(students, size, constraints, opts){
  opts=opts||{}; const hetero=!!opts.hetero; const marked=opts.marked||{}; const balanceClass=!!opts.balanceClass;
  students=(students||[]).filter(Boolean);
  const n=students.length; if(!n) return [];
  const numGroups=Math.max(1, Math.ceil(n/size));
  const cap=Math.ceil(n/numGroups);
  const conflict={};
  (constraints||[]).forEach(p=>{ const a=p[0],b=p[1]; (conflict[a]=conflict[a]||{})[b]=1; (conflict[b]=conflict[b]||{})[a]=1; });
  const classOf={}; if(balanceClass) students.forEach(s=>classOf[s]=studentClass(s));
  for(let attempt=0; attempt<400; attempt++){
    const order=buildGroupOrder(students, hetero, marked);
    const groups=[]; for(let i=0;i<numGroups;i++) groups.push([]);
    let ok=true;
    for(const s of order){
      const sc = balanceClass ? classOf[s] : null;
      const cand=[];
      for(let i=0;i<numGroups;i++){
        const g=groups[i];
        if(g.length>=cap) continue;
        if(conflict[s] && g.some(m=>conflict[s][m])) continue;
        cand.push(i);
      }
      if(!cand.length){ ok=false; break; }
      if(balanceClass){
        cand.sort((x,y)=>{
          const cx=groups[x].reduce((a,m)=>a+(classOf[m]===sc?1:0),0);
          const cy=groups[y].reduce((a,m)=>a+(classOf[m]===sc?1:0),0);
          if(cx!==cy) return cx-cy;                 // menys de la mateixa classe primer
          return groups[x].length-groups[y].length; // després, el menys ple
        });
      } else {
        cand.sort((x,y)=>groups[x].length-groups[y].length);
      }
      groups[cand[0]].push(s);
    }
    if(ok) return groups;
  }
  return null;
}
function generateGroups(size, mix, constraints, hetero){
  const byClass=STATE.students||{};
  const marked=STATE.flags||{};
  const classes=Object.keys(byClass).filter(c=>byClass[c] && byClass[c].length);
  if(!classes.length) return {error:'No hi ha alumnes. Omple la pestanya \u201cAlumnes\u201d del full de càlcul.'};
  if(mix){
    const all=[]; classes.forEach(c=>all.push(...byClass[c]));
    const g=makeGroups(all,size,constraints,{hetero, marked, balanceClass:true});
    if(!g) return {error:'No s\u2019han pogut fer els grups amb aquests condicionants. Prova amb grups més grans o treu-ne algun.'};
    return {sections:[{label:'Grups', groups:g}]};
  }
  const sections=[];
  for(const c of classes){
    const g=makeGroups(byClass[c],size,constraints,{hetero, marked, balanceClass:false});
    if(!g) return {error:`No s\u2019han pogut fer els grups de ${c} amb aquests condicionants.`};
    sections.push({label:c, groups:g});
  }
  return {sections};
}

function pickTutorClass(classes){

function buildAbsentText(){
  const att=STATE.attendance||{}; const absents=att.absents||{};
  const classes=Object.keys(STATE.students||{}).filter(c=>STATE.students[c] && STATE.students[c].length);
  const lines=['Absents de l\u2019excursió:',''];
  let total=0;
  classes.forEach(c=>{
    const abs=(STATE.students[c]||[]).filter(n=>absents[n]);
    lines.push(c+':');
    if(abs.length){ abs.forEach(n=>lines.push('- '+n)); total+=abs.length; }
    else lines.push('- (cap absent)');
    lines.push('');
  });
  lines.push('Total absents: '+total);
  return lines.join('\n');
}

function renderSubthemes(S,sec){
  const c=el('div','composer');
  c.innerHTML=`<div class="add-sub">
      <div class="field"><label>Nou subtema</label><input class="input" id="subName" placeholder="Nom del subtema…"></div>
      <button class="btn btn-primary" id="subAdd"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Afegeix</button>
    </div>`;
  S.appendChild(collapsibleComposer(c,'Nou subtema'));
  const addFn=async()=>{
    const name=$('#subName').value.trim(); if(!name){ toast('Posa un nom al subtema'); return; }
    const base=sec.id+'-'+slug(name);
    let id=base, n=2; while(STATE.subthemes.some(s=>s.id===id)){ id=base+'-'+n++; }
    await api.addSubtheme({id,section:sec.id,name,createdBy:ME,createdAt:nowISO(),order:STATE.subthemes.length});
    openSection(sec.id); toast('Subtema afegit');
  };
  $('#subAdd').onclick=addFn;
  $('#subName').addEventListener('keydown',e=>{ if(e.key==='Enter') addFn(); });

  const subs=STATE.subthemes.filter(s=>s.section===sec.id);
  if(!subs.length){ const em=el('div','empty-feed'); em.innerHTML=`<div class="big">🗂️</div>Encara no hi ha cap subtema. Afegeix-ne un!`; S.appendChild(em); return; }
  const grid=el('div','subtheme-grid');
  subs.forEach(sub=>grid.appendChild(subthemeCard(sub,sec)));
  S.appendChild(grid);
}
function subthemeCard(sub,sec){
  const entries=STATE.entries.filter(e=>e.subtheme===sub.id);
  const unread=entries.filter(e=>!(e.readBy||[]).includes(ME)).length;
  const card=el('div','subtheme-card');
  const name=el('div','st-name'); name.textContent=sub.name; card.appendChild(name);
  const meta=el('div','st-meta'); meta.textContent = entries.length? `${entries.length} entrad${entries.length===1?'a':'es'}` : 'Buit'; card.appendChild(meta);
  if(unread>0){ const bg=el('span','st-badge'); bg.textContent=unread; card.appendChild(bg); }
  const del=el('button','del'); del.title='Esborra el subtema';
  del.innerHTML=`<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>`;
  del.onclick=(ev)=>{ ev.stopPropagation();
    const msg = entries.length? `S\u2019esborrarà el subtema \u201C${sub.name}\u201D i les ${entries.length} entrades que conté.` : `S\u2019esborrarà el subtema \u201C${sub.name}\u201D.`;
    askConfirm(msg, async()=>{ await api.deleteSubtheme(sub.id); openSection(sec.id); toast('Subtema esborrat'); });
  };
  card.appendChild(del);
  card.onclick=()=>{ PICNIC_SUB=null; PICNIC_RESULT=null; openSubtheme(sec.id,sub.id); };
  return card;
}

function originLabelFromTask(t){
  const o=t.origin; if(!o) return '';
  const entry=STATE.entries.find(e=>e.id===o.entryId);
  if(entry) return originLabel(entry);

function openOrigin(o){

/* ---------- COMENTARIS (estil Google, dins l'app) ---------- */
const CMT_ICON=`<svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
/* Comentaris/respostes d'una entrada que ME encara no ha vist (i no ha escrit) */
function entryHasUnseenComments(entryId){
  return ((STATE.comments&&STATE.comments[entryId])||[]).some(t=>
    (t.author!==ME && !(t.seenBy||[]).includes(ME)) ||
    (t.replies||[]).some(r=> r.author!==ME && !(r.seenBy||[]).includes(ME)));
}
/* Fila = targeta d'entrada + botó de comentaris al costat (fora de la targeta) + panell desplegable. */
function entryRow(e,sec,subId){
  const row=el('div','entry-row');
  const main=el('div','entry-main');
  main.appendChild(entryCard(e,sec,subId));
  const threads=(STATE.comments&&STATE.comments[e.id])||[];
  const open=OPEN_COMMENTS.has(e.id);
  if(open) main.appendChild(commentPanel(e,sec,subId));
  row.appendChild(main);
  const rail=el('div','comment-rail');
  const openCount=threads.filter(t=>!t.resolved).length;
  const unseen=entryHasUnseenComments(e.id);
  const btn=el('button','comment-btn'+(open?' on':'')+(openCount?' has':'')+(unseen?' unseen':''));
  btn.title=open?'Amaga els comentaris':(unseen?'Comentaris nous':(openCount?openCount+' comentari(s)':'Comenta'));
  btn.innerHTML=CMT_ICON+(openCount?`<span class="cbadge">${openCount}</span>`:'')+(unseen?'<span class="cnew"></span>':'');
  btn.onclick=()=>{
    if(OPEN_COMMENTS.has(e.id)){ OPEN_COMMENTS.delete(e.id); }
    else { OPEN_COMMENTS.add(e.id); if(entryHasUnseenComments(e.id)) api.commentSeen(e.id); }
    reopen(sec,subId);
  };
  rail.appendChild(btn);
  row.appendChild(rail);
  return row;
}
function commentPanel(e,sec,subId){
  const panel=el('div','comment-panel');
  const head=el('div','cp-head'); head.innerHTML=CMT_ICON+' Comentaris'; panel.appendChild(head);
  const threads=(STATE.comments&&STATE.comments[e.id])||[];
  const oberts=threads.filter(t=>!t.resolved);
  const fets=threads.filter(t=>t.resolved);
  if(!threads.length){ const em=el('div','cp-empty'); em.textContent='Encara no hi ha comentaris. Escriu el primer!'; panel.appendChild(em); }
  oberts.forEach(t=>panel.appendChild(commentThread(e,t,sec,subId)));
  panel.appendChild(threadComposer(e,sec,subId,null));
  if(fets.length){
    const wrap=el('div','cp-resolved');
    const tg=el('button','cp-restoggle'); tg.innerHTML=`<svg class="icon" viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12l5 5L20 7"/></svg> Completats (${fets.length})`;
    const box=el('div','cp-resbox'); box.style.display='none';
    fets.forEach(t=>box.appendChild(commentThread(e,t,sec,subId)));
    tg.onclick=()=>{ const vis=box.style.display!=='none'; box.style.display=vis?'none':'grid'; tg.classList.toggle('open',!vis); };
    wrap.appendChild(tg); wrap.appendChild(box); panel.appendChild(wrap);
  }
  return panel;
}
function commentThread(e,t,sec,subId){
  const box=el('div','cthread'+(t.resolved?' resolved':''));
  box.appendChild(commentBubble(e,t,null,sec,subId));
  (t.replies||[]).forEach(r=>box.appendChild(commentBubble(e,t,r,sec,subId)));
  const acts=el('div','cthread-acts');
  const res=el('button','cbtn'+(t.resolved?'':' primary'));
  res.innerHTML = t.resolved
    ? `<svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg> Torna a obrir`
    : `<svg class="icon" viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12l5 5L20 7"/></svg> Marca com a completat`;
  res.onclick=async()=>{ await api.commentResolve(e.id,t.id,!t.resolved); reopen(sec,subId); };
  acts.appendChild(res);
  if(t.resolved && t.resolvedBy){ const info=el('span','cthread-info'); info.textContent='Completat per '+userById(t.resolvedBy).name; acts.appendChild(info); }
  box.appendChild(acts);
  if(!t.resolved) box.appendChild(threadComposer(e,sec,subId,t));
  return box;
}
function commentBubble(e,t,reply,sec,subId){
  const c=reply||t;
  const b=el('div','cbubble'+(reply?' creply':''));
  const hd=el('div','cb-head');
  hd.appendChild(avatarEl(c.author,26));
  const nm=el('b'); nm.textContent=userById(c.author).name; hd.appendChild(nm);
  if(c.createdAt){ const dt=el('span','cb-date'); dt.textContent='· '+fmtDate(c.createdAt); hd.appendChild(dt); }
  b.appendChild(hd);
  const tx=el('div','cb-text'); tx.textContent=c.text; b.appendChild(tx);
  const del=el('button','cb-del'); del.title='Esborra';
  del.innerHTML=`<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  del.onclick=()=>askConfirm(reply?'Vols esborrar aquesta resposta?':'Vols esborrar aquest comentari i les seves respostes?', async()=>{
    if(reply) await api.commentReplyDelete(e.id,t.id,reply.id); else await api.commentDelete(e.id,t.id);
    reopen(sec,subId);
  },{confirmLabel:'Esborra'});
  b.appendChild(del);
  return b;
}
/* Compositor unificat: thread=null → nou comentari; thread=obj → resposta al fil. */
function threadComposer(e,sec,subId,thread){
  const wrap=el('div','ccomposer'+(thread?' creply-composer':''));
  const ta=el('textarea','cinput'); ta.rows=1; ta.placeholder=thread?'Respon…':'Escriu un comentari…';
  const go=el('button','cpost'); go.textContent=thread?'Respon':'Comenta';
  const send=async()=>{ const txt=ta.value.trim(); if(!txt){ ta.focus(); return; }
    const ts=nowISO(); OPEN_COMMENTS.add(e.id);
    if(thread) await api.commentReply(e.id,thread.id,{id:uid(),author:ME,text:txt,createdAt:ts,seenBy:[ME]});
    else await api.commentAdd(e.id,{id:uid(),author:ME,text:txt,createdAt:ts,resolved:false,replies:[],seenBy:[ME]});
    reopen(sec,subId);
  };
  go.onclick=send;
  ta.addEventListener('input',()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; });
  ta.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ ev.preventDefault(); send(); } });
  wrap.appendChild(ta); wrap.appendChild(go);
  return wrap;
}

function calLegend(){
  const wrap=el('div','cal-legend');
  GROUPS.forEach(g=>{ const it=el('span','leg-item'); it.innerHTML=`<span class="leg-dot" style="background:${g.color}"></span>${g.name}`; wrap.appendChild(it); });
  const fest=el('span','leg-item'); fest.innerHTML=`<span class="leg-dot" style="background:#9aa6ad"></span>Festiu / vacances`; wrap.appendChild(fest);
  return wrap;
}
/* Festius escolars (derivats de les constants de Programació, NO es desen al full):
   festiu oficial, lliure disposició, festa local, vacances (rang) i tarda no lectiva. */
function schoolDayInfo(iso){
  if(typeof PROG_VACANCES!=='undefined'){ const v=PROG_VACANCES.find(x=> iso>=x.from && iso<=x.to); if(v) return {t:'vac', name:v.name}; }
  if(typeof PROG_FESTIUS!=='undefined'){ const f=PROG_FESTIUS.find(x=>x.date===iso);
    if(f){ if(f.kind==='lliure') return {t:'lliure', name:'Lliure disposició'};
      if(f.kind==='local') return {t:'local', name:f.name};
      return {t:'festiu', name:f.name}; } }
  if(typeof PROG_TARDES!=='undefined'){ const tr=PROG_TARDES.find(x=>x.date===iso); if(tr) return {t:'tarda', name:tr.name}; }
  return null;
}
function renderAgendaList(S,sec){
  const feed=el('div','feed');
  const list=STATE.entries.filter(e=>e.section===sec.id)
    .sort((a,b)=> (a.eventDate||'').localeCompare(b.eventDate||'') || (a.time||'').localeCompare(b.time||''));
  if(!list.length){ const em=el('div','empty-feed'); em.innerHTML=`<div class="big">📅</div>Cap data encara.`; feed.appendChild(em); }
  list.forEach(e=>feed.appendChild(e.id===EDITING ? agendaEditForm(e,sec) : agendaCard(e,sec)));
  S.appendChild(feed);
}
function renderMonthGrid(S,sec){
  if(!CAL_MONTH){ const n=new Date(); CAL_MONTH=new Date(n.getFullYear(),n.getMonth(),1); }
  const y=CAL_MONTH.getFullYear(), m=CAL_MONTH.getMonth();
  const head=el('div','cal-monthhead');
  const prev=el('button','cal-nav'); prev.innerHTML='‹'; prev.title='Mes anterior'; prev.onclick=()=>{ CAL_MONTH=new Date(y,m-1,1); openSection('calendari'); };
  const next=el('button','cal-nav'); next.innerHTML='›'; next.title='Mes següent'; next.onclick=()=>{ CAL_MONTH=new Date(y,m+1,1); openSection('calendari'); };
  const title=el('div','cal-monthtitle'); const mt=CAL_MONTH.toLocaleDateString('ca-ES',{month:'long',year:'numeric'}); title.textContent=mt.charAt(0).toUpperCase()+mt.slice(1);
  const todayb=el('button','cal-today'); todayb.textContent='Avui'; todayb.onclick=()=>{ const n=new Date(); CAL_MONTH=new Date(n.getFullYear(),n.getMonth(),1); openSection('calendari'); };
  head.appendChild(prev); head.appendChild(title); head.appendChild(next); head.appendChild(todayb);
  S.appendChild(head);
  const grid=el('div','cal-grid');
  ['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].forEach(d=>{ const w=el('div','cal-wd'); w.textContent=d; grid.appendChild(w); });
  const startDow=(new Date(y,m,1).getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  for(let i=0;i<startDow;i++) grid.appendChild(el('div','cal-cell blank'));
  const n=new Date(); const todayStr=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  const events=STATE.entries.filter(e=>e.section==='calendari'&&e.eventDate);
  for(let day=1;day<=dim;day++){
    const dstr=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const hol=schoolDayInfo(dstr);
    const cell=el('div','cal-cell'+(dstr===todayStr?' today':'')+(hol?(hol.t==='tarda'?' cal-tarda-cell':' cal-hol-cell'):''));
    const num=el('div','cal-num'); num.textContent=day; cell.appendChild(num);
    if(hol){ const hc=el('div','cal-hol'+(hol.t==='tarda'?' tarda':''));
      hc.textContent=(hol.t==='tarda'?'🌓 ':'')+hol.name+(hol.t==='tarda'?' (tarda)':'');
      hc.title=hol.t==='festiu'?('Festiu · '+hol.name):hol.name;
      cell.appendChild(hc); }
    const evs=events.filter(e=>e.eventDate===dstr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    evs.slice(0,3).forEach(ev=>{
      const chip=el('button','cal-chip'); chip.style.background=groupById(ev.group).color;
      chip.textContent=(ev.time?ev.time+' ':'')+ev.title;
      chip.title=ev.title+' · '+groupById(ev.group).name+(ev.time?' · '+fmtTimeRange(ev):'');
      chip.onclick=(e2)=>{ e2.stopPropagation(); CAL_VIEW='llista'; openAndFlash(ev.id); };
      cell.appendChild(chip);
    });
    if(evs.length>3){ const more=el('div','cal-more'); more.textContent=`+${evs.length-3} més`; cell.appendChild(more); }
    cell.onclick=(e2)=>{ if(e2.target.closest('.cal-chip'))return;
      const di=$('#aDate'); if(di) di.value=dstr;
      const comp=document.querySelector('.composer.composer-collapsed'); const trig=document.querySelector('.composer-trigger');
      if(comp && !comp.classList.contains('open') && trig) trig.click();
      window.scrollTo({top:0,behavior:'smooth'});
      const ti=$('#aTitle'); if(ti) setTimeout(()=>ti.focus(),90);
    };
    grid.appendChild(cell);
  }
  S.appendChild(grid);
}

  del.onclick=()=>{ askConfirm('Vols esborrar aquesta data del calendari?', async()=>{ await api.deleteEntry(e.id); openSection(sec.id); toast('Data esborrada'); }); };
  tools.appendChild(del);
  card.appendChild(tools);
  return card;

function agendaEditForm(e,sec){
  const card=el('div','entry editing'); card.dataset.id=e.id;

  const t=el('input','input'); t.value=e.title||'';
  const gr=el('select','input'); gr.innerHTML=groupOptions(e.group||'general');
  const d=el('input','input'); d.type='date'; d.value=e.eventDate|| (e.date? new Date(e.date).toISOString().slice(0,10):'');
  const tm=el('input','input'); tm.type='time'; tm.value=e.time||'';
  const en=el('input','input'); en.type='time'; en.value=e.endTime||'';
  const b=el('input','input'); b.value=e.body||''; b.placeholder='Detalls…';
  const u=el('input','input'); u.value=e.url||''; u.placeholder='https://…';
  card.appendChild(mk('Esdeveniment',t));
  const r1=el('div','row2'); r1.appendChild(mk('Per a qui',gr)); r1.appendChild(mk('Data',d)); card.appendChild(r1);
  const times=el('div','row2'); times.appendChild(mk('Hora',tm)); times.appendChild(mk('Fins a',en)); card.appendChild(times);
  card.appendChild(mk('Nota (opcional)',b));
  card.appendChild(mk('Enllaç (opcional)',u));
  const row=el('div','edit-actions');
  const cancel=el('button','btn btn-ghost'); cancel.textContent='Cancel·la';
  const save=el('button','btn btn-primary'); save.innerHTML=`<svg class="icon" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>Desa els canvis`;
  cancel.onclick=()=>{ EDITING=null; openSection(sec.id); };
  save.onclick=async()=>{
    if(!t.value.trim()||!d.value){ toast('Cal títol i data'); return; }
    e.title=t.value.trim(); e.group=gr.value; e.body=b.value.trim(); e.eventDate=d.value; e.date=new Date(d.value).toISOString();
    e.time=tm.value||''; e.endTime=en.value||''; e.url=normUrl(u.value);
    e.updatedAt=nowISO(); e.editedBy=ME; e.readBy=[ME];
    EDITING=null; await api.updateEntry(e); openSection(sec.id); toast('Modificació desada · torna a sortir a Novetats');
  };
  row.appendChild(cancel); row.appendChild(save); card.appendChild(row);

/* ============================================================
   CERCADOR GLOBAL
   ============================================================ */
const norm = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
/* Cerca global: busca a TOTES les àrees de l'app */
function searchAll(q){
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  if(!tokens.length) return [];
  const match = text => { const t=norm(text); return tokens.every(tok=>t.includes(tok)); };
  const res=[]; const add=o=>{ res.push(o); };
  const cut=(s,n)=>{ s=String(s||'').replace(/\s+/g,' ').trim(); return s.length>n?s.slice(0,n)+'…':s; };

  // 1) Entrades (aspectes generals, calendari, comandes, enllaços i subtemes)
  STATE.entries.forEach(e=>{ if(match((e.title||'')+' '+stripHtml(e.body||'')+' '+(e.url||'')))
    add({g:0,type:'entry',item:e,section:e.section,date:e.updatedAt||e.date}); });
  // 2) Tasques
  STATE.tasks.forEach(t=>{ if(match((t.title||'')+' '+(t.desc||'')))
    add({g:0,type:'task',item:t,section:'tasques',date:t.updatedAt||t.date}); });
  // 3) Comentaris (i respostes)
  Object.keys(STATE.comments||{}).forEach(eid=>{
    const entry=STATE.entries.find(e=>e.id===eid); if(!entry) return;
    ((STATE.comments||{})[eid]||[]).forEach(th=>{
      [{a:th.author,t:th.text,at:th.createdAt}].concat((th.replies||[]).map(r=>({a:r.author,t:r.text,at:r.createdAt})))
        .forEach(u=>{ if(match(u.t||'')) add({g:1,type:'comment',section:entry.section,author:u.a,date:u.at,
          title:'Comentari a «'+(entry.title||stripHtml(entry.body||'').slice(0,30))+'»', snippet:u.t,
          go:()=>{ OPEN_COMMENTS.add(eid); try{ api.commentSeen(eid); }catch(e2){} openAndFlash(eid); }}); });
    });
  });
  // 4) Subtemes (projectes, excursions, activitats)
  (STATE.subthemes||[]).forEach(s=>{ if(match(s.name||''))
    add({g:1,type:'sub',section:s.section,title:s.name,snippet:'Subtema de '+(secById(s.section)||{}).name,
      go:()=>{ closeSearch(); openSubtheme(s.section,s.id); }}); });
  // 5) Correus
  (STATE.correus||[]).forEach(c=>{ if(match((c.title||'')+' '+stripHtml(c.body||'')))
    add({g:1,type:'correu',section:'correus',author:c.author,date:c.createdAt||c.date,
      title:c.title||'(sense assumpte)', snippet:stripHtml(c.body||''),
      go:()=>{ closeSearch(); openSection('correus'); }}); });
  // 6) Frases d'avaluació
  TRIMESTRES.forEach(tri=>{ const byS=(STATE.avaluacio||{})[tri.id]||{};
    Object.keys(byS).forEach(subjId=>{
      const subj=(subjectsForTri(tri.id)||[]).find(x=>x.id===subjId)||{name:subjId};
      (byS[subjId]||[]).forEach(l=>{
      if(match((subj.name||'')+' '+(l.name||'')+' '+(l.phrase||''))){
        add({g:2,type:'aval',section:'avaluacio',title:subj.name+' · '+(l.name||''),snippet:l.phrase||'',
          go:()=>{ closeSearch(); PENDING_AV={tri:tri.id, subj:subjId}; openSection('avaluacio'); },
          extra:tri.name});
      }
    }); });
  });
  // 7) Programació (setmanes de cada assignatura, projectes de Medi i carpeta viatgera)
  try{
    const weeks=PROG_WEEKS_ARR.filter(w=>!w.isVac);
    ['mates','catala','medi'].forEach(subj=>{
      weeks.forEach((w,i)=>{
        const cell=progCell(subj,w.monday);
        const items=progItemsView(subj,w.monday);
        const txt=items.map(x=>x.t).join(' | ')+' '+(cell.notes||'')+' '+(cell.title||'');
        if(match(txt)){
          const hit=items.filter(x=>match(x.t||''))[0];
          add({g:3,type:'prog',section:'programacio',
            title:(PROG_SUBJECTS.find(s=>s.id===subj)||{}).name+' · Setmana '+w.teachingN,
            snippet: hit? hit.t : cut(cell.notes||cell.title,120), extra:progWeekLabel(w),
            go:()=>{ closeSearch(); PROG_SUBJECT=subj; PROG_VIEW='week'; PROG_WEEK_IDX=PROG_WEEKS_ARR.indexOf(w); openSection('programacio'); }});
        }
      });
    });
    // Medi per projectes
    if(typeof PROG_MEDI_PROJ!=='undefined') PROG_MEDI_PROJ.forEach(p=>{
      const items=progItemsView('medi',p.key);
      const txt=p.nom+' '+items.map(x=>x.t).join(' | ')+' '+(p.pla||[]).join(' ');
      if(match(txt)){ const hit=items.filter(x=>match(x.t||''))[0];
        add({g:3,type:'prog',section:'programacio',title:'Medi · '+p.nom,snippet:hit?hit.t:cut((p.pla||[])[0],120),
          go:()=>{ closeSearch(); PROG_SUBJECT='medi'; MEDI_VIEW='projectes'; openSection('programacio'); }}); }
    });
    // Carpeta viatgera
    (typeof CV_GIVES!=='undefined'?CV_GIVES:[]).forEach((g,idx)=>{
      const cell=progCell('carpeta',g); const items=progItemsView('carpeta',g);
      const txt=(cell.title||'')+' '+items.map(x=>x.t).join(' | ')+' '+(cell.notes||'');
      if(match(txt)){ const hit=items.filter(x=>match(x.t||''))[0];
        add({g:3,type:'prog',section:'programacio',title:'Carpeta viatgera · cicle '+(idx+1),
          snippet:hit?hit.t:cut(cell.title||cell.notes,120),extra:cvDateLabel(g),
          go:()=>{ closeSearch(); PROG_SUBJECT='carpeta'; CV_VIEW='cycle'; CV_IDX=idx; openSection('programacio'); }}); }
    });
  }catch(e){}
  // 8) El racó dels reptes (caixes, nivells i alumnes)
  try{
    (REPTES.caixes||[]).forEach(c=>{
      if(match((c.codi||'')+' '+(c.nom||'')+' '+(c.nn||'')+' '+(c.d||''))){
        const esTema=reptEsTema(c);
        add({g:4,type:'repte',section:'eines',
          title:(c.codi?c.codi+' · ':'')+(esTema?c.nom:(c.nn||c.nom))+(c.nivell?' '+reptStars(c.nivell):''),
          snippet:c.d||'', extra:esTema?'Caixa':'Nivell',
          go:()=>{ closeSearch(); PENDING_EINA='reptes'; REPTES_VIEW='caixes';
            REPTES_CAIXA=esTema?null:c.id; openSection('eines'); }});
      }
    });
    const alumnes=[...new Set((REPTES.registres||[]).map(r=>r.alumne))].filter(a=>match(a||''));
    alumnes.forEach(a=>{ const n=(REPTES.registres||[]).filter(r=>r.alumne===a).length;
      add({g:4,type:'repte',section:'eines',title:a,snippet:n+' caixa(es) registrades al racó dels reptes',extra:'Alumne',
        go:()=>{ closeSearch(); PENDING_EINA='reptes'; REPTES_VIEW='alumne'; REPTES_ALUMNE=a; openSection('eines'); }}); });
  }catch(e){}

  res.sort((a,b)=> (a.g-b.g) || (new Date(b.date||0)-new Date(a.date||0)) || String(a.title||'').localeCompare(String(b.title||'')));
  return res;
}
const searchOv=$('#search');
$('#searchBtn').onclick=openSearch;
$('#searchClose').onclick=closeSearch;
searchOv.addEventListener('click',e=>{ if(e.target.dataset.sclose!==undefined) closeSearch(); });
$('#searchInput').addEventListener('input',e=>renderSearch(e.target.value));

function openSearch(){ searchOv.classList.add('open'); $('#searchInput').value=''; renderSearch(''); setTimeout(()=>$('#searchInput').focus(),60); }
function closeSearch(){ searchOv.classList.remove('open'); }
function renderSearch(q){
  const box=$('#searchResults'); box.innerHTML='';
  const query=q.trim();
  if(!query){ const h=el('div','search-empty'); h.textContent='Escriu una paraula clau per buscar-la a totes les àrees.'; box.appendChild(h); return; }
  const res=searchAll(query);
  if(!res.length){ const h=el('div','search-empty'); h.innerHTML=`Cap resultat per <b>\u201C${esc(query)}\u201D</b>.`; box.appendChild(h); return; }
  const head=el('div','search-empty'); head.style.padding='6px 4px'; head.style.background='transparent'; head.style.boxShadow='none';
  head.style.textAlign='left'; head.textContent=`${res.length} resultat${res.length===1?'':'s'}`; box.appendChild(head);
  res.forEach(r=>box.appendChild(searchRow(r)));
}
const SEARCH_ICO={comment:'💬',sub:'📁',correu:'✉️',aval:'📝',prog:'📅',repte:'🎯'};
function searchRow(r){
  const sec=secById(r.section)||{name:'',color:'var(--muted)'};
  const isTask=r.type==='task', isEntry=r.type==='entry';
  const row=el('button','sres');
  if(r.item) row.dataset.id=r.item.id;
  const author = r.item ? r.item.author : r.author;
  if(author && userById(author).name) row.appendChild(avatarEl(author,32));
  else { const ic=el('div','sres-ico'); ic.textContent=SEARCH_ICO[r.type]||'•'; row.appendChild(ic); }
  const body=el('div','body');
  const top=el('div','top');
  const tag=el('span','chip'); tag.style.background=sec.color+'22'; tag.style.color=sec.color; tag.textContent=sec.name; top.appendChild(tag);
  if(isTask){ const st=STATUSES.find(s=>s.id===r.item.status); if(st){ const stc=el('span','chip'); stc.style.background=st.color; stc.style.color='#fff'; stc.textContent=st.name; top.appendChild(stc); } }
  if(r.extra){ const ex=el('span','chip'); ex.style.background='var(--panel-2)'; ex.style.color='var(--muted)'; ex.textContent=r.extra; top.appendChild(ex); }
  body.appendChild(top);
  const h=el('h5'); h.textContent=(r.item? (r.item.title||sec.name) : (r.title||sec.name)); body.appendChild(h);
  const snippet = r.item ? (isTask ? (r.item.desc||'') : stripHtml(r.item.body||'')) : (r.snippet||'');
  if(snippet){ const p=el('p'); p.textContent=snippet; body.appendChild(p); }
  row.appendChild(body);
  row.onclick = r.go ? r.go : ()=>openAndFlash(r.item.id);
  return row;
}
function openAndFlash(itemId){
  closeSearch();
  PICNIC_SUB=null; PICNIC_RESULT=null;
  const entry=STATE.entries.find(e=>e.id===itemId);
  const task=STATE.tasks.find(t=>t.id===itemId);
  if(entry){ if(entry.section==='calendari') CAL_VIEW = entry.eventDate ? 'llista' : 'agendar';
    if(entry.subtheme) openSubtheme(entry.section, entry.subtheme); else openSection(entry.section); }
  else if(task){ openSection('tasques'); }
  else return;
  setTimeout(()=>{
    const node=document.querySelector(`#section [data-id="${itemId}"]`);
    if(node){ node.scrollIntoView({behavior:'smooth',block:'center'}); node.classList.add('flash');
      setTimeout(()=>node.classList.remove('flash'),1700); }
  },440);
}

(async function boot(){
  buildLogin();
  try{ const rp=new URLSearchParams(location.search).get('repte'); if(rp) PENDING_REPTE=rp; }catch(e){}
  try{ PENDING=_loadPending(); }catch(e){}
  let saved=null; try{ saved=localStorage.getItem('coord_me'); }catch(e){}
  const auto = saved && USERS.some(u=>u.id===saved);
  if(auto){
    const cached = safeLoad();
    if(cached){ STATE=cached; try{ normalizeState(); }catch(e){} }
    login(saved);            // entra a l'instant, sense mostrar la pantalla de login
  }
  await api.init();           // baixa les dades fresques del núvol
  try{ reptesLoad(); }catch(e){}   // sembra/actualitza les caixes DESPRÉS de tenir l'estat real
  startCloudSync();
  try{ flushPending(); }catch(e){}
  if(auto){ refreshHome(); }  // repinta l'inici amb les dades ja actualitzades
  try{ reptApplyPending(); }catch(e){}   // NFC: obre la caixa un cop hi ha dades
})();
/* Service worker: accelera les càrregues repetides (fail-safe: si no es pot, l'app funciona igual) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{}); });
}
